<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Free AI Browser Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header><img src="icons/icon48.png" alt=""><div><strong>Free AI</strong><span>Browser Bridge</span></div></header>
    <section class="status"><span id="dot"></span><div><b id="bridge">Checking desktop bridge…</b><small id="summary">Free AI must be open on this computer.</small></div></section>
    <section><h2>Connected AI tabs</h2><div id="providers" class="providers"></div></section>
    <div class="actions"><button id="rescan">Rescan tabs</button><button id="reconnect">Reconnect</button></div>
    <p class="note">The extension connects only to the local Free AI bridge at 127.0.0.1:17341. It does not upload browser data to a separate extension service.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
