name: Android A3 Mode Menu Device Verification

on:
  push:
    branches: [audit/android-a1-ui]
    paths:
      - .github/workflows/android-a1-audit.yml
      - scripts/android-a3-mode-menu-audit.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  mode_menu:
    name: PR141 mode menu on Android 16 Pixel 5
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out audit harness
        uses: actions/checkout@v4
        with:
          ref: audit/android-a1-ui
          path: audit-harness
          persist-credentials: false

      - name: Check out exact PR product commit
        uses: actions/checkout@v4
        with:
          ref: ae9ba4813bdb9b6dec798da76c69d41168b32165
          path: product
          persist-credentials: false

      - name: Verify immutable PR artifact
        uses: actions/github-script@v7
        with:
          script: |
            const repo=context.repo;
            const {data:pr}=await github.rest.pulls.get({...repo,pull_number:141});
            if(pr.state!=='open'||pr.merged||pr.head.sha!=='ae9ba4813bdb9b6dec798da76c69d41168b32165') throw new Error('PR moved');
            const {data:main}=await github.rest.git.getRef({...repo,ref:'heads/main'});
            if(main.object.sha!=='07db982d6b409fa6c313ece8c2a99912815a0419') throw new Error('main moved');
            const {data:run}=await github.rest.actions.getWorkflowRun({...repo,run_id:36280484033});
            if(run.head_sha!==pr.head.sha||run.status!=='completed'||run.conclusion!=='success'||run.run_attempt!==1) throw new Error('Unexpected source run');
            const {data:artifact}=await github.rest.actions.getArtifact({...repo,artifact_id:10918128064});
            if(artifact.name!=='free-ai-android-runtime-qa'||artifact.expired||artifact.digest!=='sha256:455e50da676462a8bb90f28935e5b0dd493c8f629362b33013f6d69cf3ca4b89') throw new Error('Unexpected artifact');

      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '10918128064'
          run-id: 36280484033
          github-token: ${{ github.token }}
          path: product/runtime-artifacts

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify mode menu
        id: verify
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072M
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: cd product && python3 ../audit-harness/scripts/android-a3-mode-menu-audit.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-pr141-android-mode-menu
          path: product/artifacts/android-a3-pr141-mode-menu/**
          if-no-files-found: error

      - name: Enforce result
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          test "$VERIFY_OUTCOME" = success
          cd product
          python3 - <<'PY'
          import json
          rows=json.load(open('artifacts/android-a3-pr141-mode-menu/results.json'))
          assert len(rows)==3,rows
          assert all(r['status']=='PASS' for r in rows),rows
          bounds=json.load(open('artifacts/android-a3-pr141-mode-menu/bounds.json'))
          assert bounds['Chat'] and bounds['Work'] and bounds['Select model'],bounds
          PY
