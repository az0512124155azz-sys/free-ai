name: Android A2 Remote Controls Main Sanity

on:
  push:
    branches: [audit/android-a1-ui]
    paths: [.github/workflows/android-a1-audit.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-a2-main-07db982d-remote-controls
  cancel-in-progress: false

env:
  AUDIT_TARGET: 07db982d6b409fa6c313ece8c2a99912815a0419
  SOURCE_RUN: '36278406199'
  SOURCE_ARTIFACT: '10917708306'

jobs:
  remote_controls:
    name: Main Remote controls on Android 16 Pixel 5
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out exact main product commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.AUDIT_TARGET }}
          persist-credentials: false

      - name: Verify exact main APK provenance
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const repo=context.repo;
            const target=process.env.AUDIT_TARGET;
            const runId=Number(process.env.SOURCE_RUN);
            const artifactId=Number(process.env.SOURCE_ARTIFACT);

            const {data:main}=await github.rest.git.getRef({...repo,ref:'heads/main'});
            if(main.object.sha!==target){
              throw new Error('main moved; focused device verification must be re-audited');
            }

            const {data:run}=await github.rest.actions.getWorkflowRun({...repo,run_id:runId});
            if(run.id!==runId||run.head_sha!==target||run.head_branch!=='main'||
               run.event!=='push'||run.workflow_id!==363617952||!['in_progress','completed'].includes(run.status)||
               ![1,2].includes(run.run_attempt)){
              throw new Error('Unexpected main build provenance');
            }

            const {data:build}=await github.rest.actions.getJobForWorkflowRun({...repo,job_id:108505468990});
            if(build.run_id!==run.id||build.head_sha!==target||build.name!=='android'||
               build.status!=='completed'||build.conclusion!=='success'){
              throw new Error('Exact Android APK-producing job is not successful');
            }
            for(const name of ['Validate JavaScript','Build APK','Build runtime QA APKs','Upload Android runtime QA APK']){
              const steps=(build.steps||[]).filter(step=>step.name===name);
              if(steps.length!==1||steps[0].status!=='completed'||steps[0].conclusion!=='success'){
                throw new Error('Required Android step did not succeed: '+name);
              }
            }

            const {data:artifact}=await github.rest.actions.getArtifact({...repo,artifact_id:artifactId});
            if(artifact.id!==artifactId||artifact.name!=='free-ai-android-runtime-qa'||artifact.expired||
               artifact.workflow_run?.id!==run.id||artifact.workflow_run?.head_sha!==target){
              throw new Error('Unexpected QA APK artifact');
            }
            if(artifact.digest!=='sha256:bdad089270fe75154328ec78edc87906fea6c8eda37e41b60548cf1ec451c79f'){
              throw new Error('QA APK artifact digest changed');
            }

            fs.mkdirSync('artifacts/android-a2-main-07db982d',{recursive:true});
            fs.writeFileSync('artifacts/android-a2-main-07db982d/provenance.json',JSON.stringify({
              targetSha:target,mainSha:main.object.sha,sourceRun:run.id,
              sourceAttempt:run.run_attempt,sourceStatus:run.status,sourceConclusion:run.conclusion,
              androidBuildJob:build.id,artifactId:artifact.id,artifactDigest:artifact.digest,
              device:'Android API 36 Pixel 5',
              scope:'Merged Remote/Super AI controls verification only'
            },null,2));

      - name: Download immutable main QA APK
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '10917708306'
          run-id: 36278406199
          github-token: ${{ github.token }}
          path: runtime-artifacts

      - name: Prepare focused native driver
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/android-a2-main-remote.py" <<'PY'
          import hashlib, json, pathlib, re, subprocess, time, uuid
          import xml.etree.ElementTree as ET

          OUT=pathlib.Path('artifacts/android-a2-main-07db982d')
          OUT.mkdir(parents=True,exist_ok=True)
          PACKAGE='com.freeai.mobile'
          rows=[]
          serials=[line.split()[0] for line in subprocess.check_output(['adb','devices'],text=True).splitlines()[1:] if line.endswith('\tdevice')]
          if len(serials)!=1: raise RuntimeError('Expected exactly one emulator: '+repr(serials))
          SERIAL=serials[0]
          capture_seq=0
          last_xml=None

          def adb(*args,binary=False,timeout=25):
              return subprocess.check_output(['adb','-s',SERIAL,*args],timeout=timeout,text=not binary)

          def norm(value):
              return ' '.join(str(value or '').split()).strip()

          def labels_for(node):
              return [norm(node.get('text','')),norm(node.get('content-desc',''))]

          def visible_enabled(node):
              if node.get('enabled')=='false': return False
              bounds=list(map(int,re.findall(r'\d+',node.get('bounds',''))))
              return len(bounds)==4 and bounds[2]>bounds[0] and bounds[3]>bounds[1]

          def action_nodes(nodes,title):
              prefix=title+' '
              found=[]
              for node in nodes:
                  if not visible_enabled(node): continue
                  values=[v for v in labels_for(node) if v]
                  if any(v==title or v.startswith(prefix) for v in values):
                      found.append(node)
              return found

          def dump(name,deadline=None):
              global capture_seq,last_xml
              end=deadline or (time.monotonic()+25)
              capture_seq+=1
              rootdir=OUT/'ui-dumps'/f'{capture_seq:02d}-{name}-{uuid.uuid4().hex}'
              rootdir.mkdir(parents=True,exist_ok=False)
              last='no fresh UI hierarchy'
              for attempt in range(1,6):
                  if time.monotonic()>=end: break
                  folder=rootdir/f'attempt-{attempt}'
                  folder.mkdir()
                  remote=f'/sdcard/freeai-a2-main-{uuid.uuid4().hex}.xml'
                  try:
                      subprocess.run(['adb','-s',SERIAL,'shell','rm','-f',remote],check=False,capture_output=True,timeout=8)
                      gen=subprocess.run(['adb','-s',SERIAL,'shell','uiautomator','dump',remote],check=False,capture_output=True,timeout=12)
                      read=subprocess.run(['adb','-s',SERIAL,'exec-out','cat',remote],check=False,capture_output=True,timeout=8)
                      (folder/'dump.stdout').write_bytes(gen.stdout)
                      (folder/'dump.stderr').write_bytes(gen.stderr)
                      (folder/'raw.xml').write_bytes(read.stdout)
                      diagnostics=(gen.stdout+b'\n'+gen.stderr).decode('utf-8',errors='replace')
                      if gen.returncode or read.returncode: raise RuntimeError('dump/read command failed')
                      if re.search(r'ERROR:|null root node|could not get idle state',diagnostics,re.I):
                          raise RuntimeError('UIAutomator reported capture failure')
                      if not read.stdout.strip(): raise RuntimeError('empty XML')
                      tree=ET.fromstring(read.stdout)
                      nodes=list(tree.iter('node'))
                      if tree.tag!='hierarchy' or not nodes: raise RuntimeError('invalid hierarchy')
                      last_xml=str((folder/'raw.xml').relative_to(OUT))
                      (folder/'accepted.json').write_text(json.dumps({
                        'accepted':True,'name':name,'attempt':attempt,'remotePath':remote,
                        'sha256':hashlib.sha256(read.stdout).hexdigest(),'nodeCount':len(nodes)
                      },indent=2))
                      return nodes
                  except Exception as exc:
                      last=str(exc)
                      (folder/'rejected.txt').write_text(last)
                      if time.monotonic()<end: time.sleep(0.5)
              raise RuntimeError('Fresh UI tree unavailable for '+name+': '+last)

          def find(nodes,title):
              matches=action_nodes(nodes,title)
              if not matches: return None
              node=matches[0]
              b=list(map(int,re.findall(r'\d+',node.get('bounds',''))))
              return node,b

          def wait_text(title,name,seconds=30):
              end=time.monotonic()+seconds
              while time.monotonic()<end:
                  nodes=dump(name,deadline=end)
                  if find(nodes,title): return nodes
                  time.sleep(0.5)
              raise RuntimeError('UI target not found: '+title)

          def tap(title,name):
              nodes=wait_text(title,name+'-before')
              node,(x1,y1,x2,y2)=find(nodes,title)
              x,y=(x1+x2)//2,(y1+y2)//2
              with (OUT/'taps.jsonl').open('a') as f:
                  f.write(json.dumps({'target':title,'xml':last_xml,'bounds':node.get('bounds'),'center':[x,y]})+'\n')
              adb('shell','input','tap',str(x),str(y))
              time.sleep(0.8)

          def screenshot(name):
              (OUT/(name+'.png')).write_bytes(adb('exec-out','screencap','-p',binary=True))
              return dump(name)

          def record(name,status,detail):
              rows.append({'name':name,'status':status,'detail':detail})
              (OUT/'results.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False))
              print(status,name,detail,flush=True)

          def labels(nodes):
              return sorted({value for node in nodes if visible_enabled(node) for value in labels_for(node) if value})

          apk=next(pathlib.Path('runtime-artifacts').rglob('free-ai-runtime-qa.apk'))
          (OUT/'apk-sha256.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'\n')
          (OUT/'device.txt').write_text(adb('shell','getprop','ro.build.version.release')+adb('shell','getprop','ro.build.version.sdk')+adb('shell','wm','size'))
          adb('install','-r',str(apk))
          adb('logcat','-c')
          adb('shell','am','force-stop',PACKAGE)
          adb('shell','am','start','-W','-n',PACKAGE+'/.MainActivity')
          wait_text('Open navigation','launch-ready',40)

          free_nodes=screenshot('01-free-chat')
          free_picker=action_nodes(free_nodes,'Select model')
          record('Free AI model picker present','PASS' if len(free_picker)==1 else 'FAIL','visible Select model triggers='+str(len(free_picker)))

          if free_picker:
              tap('Select model','open-free-picker')
              picker_nodes=screenshot('02-free-picker-open')
              record('Free AI picker opens','PASS' if action_nodes(picker_nodes,'Models') else 'FAIL','Models panel visibility checked')
              tap('Select model','close-free-picker')

          tap('Open navigation','open-nav')
          wait_text('Remote','nav-remote-ready')
          (OUT/'03-free-nav.png').write_bytes(adb('exec-out','screencap','-p',binary=True))
          tap('Remote','enter-remote')
          wait_text('Remote','remote-ready')
          remote_nodes=screenshot('04-remote')

          remote_picker=action_nodes(remote_nodes,'Select model')
          record('Remote manual model picker absent','PASS' if not remote_picker else 'FAIL','visible Select model triggers='+str(len(remote_picker)))
          record('Remote screen active','PASS' if action_nodes(remote_nodes,'Remote') else 'FAIL','Remote header checked')

          tap('Open navigation','open-remote-nav')
          remote_nav=screenshot('05-remote-nav')
          repository=action_nodes(remote_nav,'Choose repository')
          coding=action_nodes(remote_nav,'Coding')
          record('Remote repository control absent','PASS' if not repository else 'FAIL','visible Choose repository controls='+str(len(repository)))
          record('Remote Coding group absent','PASS' if not coding else 'FAIL','visible Coding groups='+str(len(coding)))

          (OUT/'free-labels.json').write_text(json.dumps(labels(free_nodes),indent=2,ensure_ascii=False))
          (OUT/'remote-labels.json').write_text(json.dumps(labels(remote_nodes),indent=2,ensure_ascii=False))
          (OUT/'remote-nav-labels.json').write_text(json.dumps(labels(remote_nav),indent=2,ensure_ascii=False))
          (OUT/'summary.json').write_text(json.dumps({
              'Free AI Select model':len(free_picker),
              'Remote Select model':len(remote_picker),
              'Remote Choose repository':len(repository),
              'Remote Coding':len(coding)
          },indent=2))
          (OUT/'logcat.txt').write_text(adb('logcat','-d'))
          (OUT/'crash.txt').write_text(adb('logcat','-b','crash','-d'))

          if any(row['status']!='PASS' for row in rows):
              raise SystemExit(1)
          PY
          python3 -m py_compile "$RUNNER_TEMP/android-a2-main-remote.py"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify merged Remote controls on Android 16 Pixel 5
        id: verify
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072M
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 "$RUNNER_TEMP/android-a2-main-remote.py"

      - name: Upload focused merged Remote evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-main-07db982d-android-remote-controls-device
          path: artifacts/android-a2-main-07db982d/**
          if-no-files-found: error

      - name: Enforce focused merged device result
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          test "$VERIFY_OUTCOME" = success
          python3 - <<'PY'
          import json
          rows=json.load(open('artifacts/android-a2-main-07db982d/results.json'))
          assert len(rows)==6,rows
          assert all(row['status']=='PASS' for row in rows),rows
          summary=json.load(open('artifacts/android-a2-main-07db982d/summary.json'))
          assert summary['Free AI Select model']==1,summary
          assert summary['Remote Select model']==0,summary
          assert summary['Remote Choose repository']==0,summary
          assert summary['Remote Coding']==0,summary
          PY
          git diff --exit-code -- src electron tests scripts package.json
