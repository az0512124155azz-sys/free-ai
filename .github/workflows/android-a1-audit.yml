name: Android A1 UI Audit

on:
  push:
    branches: [audit/android-a1-ui]
    paths: [.github/workflows/android-a1-audit.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-a1-exact-main-audit
  cancel-in-progress: false

env:
  AUDIT_TARGET: 77ffab72d32482db83dfff56302403a8b5ff81a8

jobs:
  android_a1:
    name: Android A1 exact-main native UI audit
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out exact product main, never the old audit product
        uses: actions/checkout@v4
        with:
          ref: 77ffab72d32482db83dfff56302403a8b5ff81a8
          persist-credentials: false
      - name: Verify exact APK provenance
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const repo=context.repo;
            const {data:main}=await github.rest.git.getRef({...repo,ref:'heads/main'});
            if(main.object.sha!==process.env.AUDIT_TARGET)throw new Error('Main moved; re-audit before running');
            const {data:run}=await github.rest.actions.getWorkflowRun({...repo,run_id:36273360567});
            const {data:artifact}=await github.rest.actions.getArtifact({...repo,artifact_id:10916353076});
            if(run.head_sha!==process.env.AUDIT_TARGET||run.conclusion!=='success')throw new Error('Unexpected product build');
            if(artifact.workflow_run.id!==run.id||artifact.workflow_run.head_sha!==run.head_sha||artifact.name!=='free-ai-android-runtime-qa'||artifact.expired)throw new Error('Unexpected QA APK');
            if(artifact.digest!=='sha256:bc72cb5e6ce0c891a88932f66a3bf2af8c0b6be3e095f8e412f38d4b1d066118')throw new Error('Artifact digest changed');
            fs.mkdirSync('artifacts/android-a1-77ffab72',{recursive:true});
            fs.writeFileSync('artifacts/android-a1-77ffab72/provenance.json',JSON.stringify({targetSha:run.head_sha,workflowSha:context.sha,sourceRun:run.id,artifactId:artifact.id,digest:artifact.digest,mode:'Auth-independent QA APK, native adb UI-tree-derived taps, no product patch',device:'Android API 36 Pixel 5'},null,2));
      - name: Download immutable current-main QA APK
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '10916353076'
          run-id: 36273360567
          github-token: ${{ github.token }}
          path: runtime-artifacts
      - name: Prepare audit-only native driver
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/android-a1-native.py" <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, time, traceback
          import xml.etree.ElementTree as ET
          OUT=pathlib.Path('artifacts/android-a1-77ffab72')
          OUT.mkdir(parents=True,exist_ok=True)
          PACKAGE='com.freeai.mobile'
          rows=[]
          serials=[line.split()[0] for line in subprocess.check_output(['adb','devices'],text=True).splitlines()[1:] if line.endswith('\tdevice')]
          if len(serials)!=1: raise RuntimeError('Expected one emulator: '+repr(serials))
          SERIAL=serials[0]
          def adb(*args,binary=False):
              return subprocess.check_output(['adb','-s',SERIAL,*args],timeout=25,text=not binary)
          def norm(value): return ' '.join(value.split()).strip()
          def dump(name):
              adb('shell','uiautomator','dump','/sdcard/freeai-a1.xml')
              raw=adb('exec-out','cat','/sdcard/freeai-a1.xml')
              (OUT/(name+'.xml')).write_text(raw)
              root=ET.fromstring(raw[raw.index('<?xml'):])
              nodes=list(root.iter('node'))
              (OUT/(name+'-labels.json')).write_text(json.dumps(sorted(labels(nodes)),ensure_ascii=False,indent=2))
              return nodes
          def labels(nodes):
              return set(norm(n.get(k,'')) for n in nodes for k in ['text','content-desc'])-{''}
          def match(nodes,text):
              for n in nodes:
                  if text in [norm(n.get('text','')),norm(n.get('content-desc',''))] and n.get('enabled')!='false':
                      b=list(map(int,re.findall(r'\d+',n.get('bounds',''))))
                      if len(b)==4 and b[2]>b[0] and b[3]>b[1]: return n,b
              return None
          def wait_text(text,name,seconds=25):
              end=time.monotonic()+seconds
              while time.monotonic()<end:
                  nodes=dump(name)
                  if match(nodes,text): return nodes
                  time.sleep(0.5)
              raise RuntimeError('UI target not found: '+text)
          def tap(text,name):
              nodes=wait_text(text,name+'-before')
              node,(x1,y1,x2,y2)=match(nodes,text)
              entry={'target':text,'bounds':node.get('bounds'),'serial':SERIAL,'center':[(x1+x2)//2,(y1+y2)//2]}
              with (OUT/'taps.jsonl').open('a') as f: f.write(json.dumps(entry)+'\n')
              adb('shell','input','tap',str(entry['center'][0]),str(entry['center'][1]))
              time.sleep(0.7)
          def shot(name):
              (OUT/(name+'.png')).write_bytes(adb('exec-out','screencap','-p',binary=True))
              return dump(name)
          def back():
              adb('shell','input','keyevent','4')
              time.sleep(0.7)
          def record(name,status,detail):
              rows.append({'name':name,'status':status,'detail':detail})
              (OUT/'results.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False))
              print(status,name,detail,flush=True)
          def launch():
              adb('shell','am','force-stop',PACKAGE)
              adb('shell','am','start','-W','-n',PACKAGE+'/.MainActivity')
              wait_text('Open navigation','ready',40)
          def signature(nodes):
              return sorted((n.get('text',''),n.get('content-desc',''),n.get('bounds',''),n.get('clickable','')) for n in nodes if n.get('package')==PACKAGE)
          def run_case(name,fn):
              try: fn()
              except Exception as exc:
                  record(name,'BLOCKED',str(exc))
                  (OUT/(name+'-exception.txt')).write_text(traceback.format_exc())
                  try: shot(name+'-blocked')
                  except Exception: pass
          apk=next(pathlib.Path('runtime-artifacts').rglob('free-ai-runtime-qa.apk'))
          (OUT/'apk-sha256.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'\n')
          (OUT/'device.txt').write_text(adb('shell','getprop','ro.build.version.release')+adb('shell','getprop','ro.build.version.sdk')+adb('shell','wm','size'))
          adb('install','-r',str(apk))
          (OUT/'resolved-activity.txt').write_text(adb('shell','cmd','package','resolve-activity','--brief',PACKAGE))
          adb('logcat','-c')
          def work_case():
              launch()
              wait_text('Free AI \u00b7 Chat','chat-ready')
              shot('01-main-ready')
              record('Initial native screen','PASS','Chat header and Open navigation in native tree; inspect screenshot for splash')
              tap('Add','chat-add')
              wait_text('Files','chat-add-open')
              chat=shot('02-chat-add')
              record('Chat Add opens','PASS',', '.join(sorted(labels(chat))))
              back()
              tap('Free AI \u00b7 Chat','mode-menu')
              wait_text('Work','mode-menu-open')
              shot('03-mode-menu')
              tap('Work','select-work')
              wait_text('Free AI \u00b7 Work','work-ready')
              shot('04-work')
              tap('Add','work-add')
              wait_text('Files','work-add-open')
              work=shot('05-work-add')
              duplicate={'Files','Attach files'}.issubset(labels(work))
              record('Work duplicate file actions','FAIL' if duplicate else 'PASS',', '.join(sorted(labels(work))))
              back()
          def remote_case():
              launch()
              tap('Open navigation','open-drawer')
              wait_text('Remote','drawer-ready')
              shot('06-drawer')
              tap('Remote','remote-shortcut')
              wait_text('Open navigation','remote-ready')
              time.sleep(1)
              remote=shot('07-remote')
              if 'Remote' not in labels(remote): raise RuntimeError('Remote header not found after shortcut')
              record('Remote shortcut','PASS','Remote header visible after native tap')
              visible=bool(match(remote,'Select model'))
              record('Remote automatic-team UI','FAIL' if visible else 'PASS','Select model remains visible' if visible else 'No Select model action visible; live team execution not tested')
              if visible:
                  tap('Select model','remote-model')
                  shot('08-remote-model-picker')
                  back()
              tap('Open navigation','remote-drawer')
              before=shot('09-remote-drawer')
              if not match(before,'Choose repository'):
                  scroll=[n for n in before if n.get('scrollable')=='true' and n.get('package')==PACKAGE]
                  if scroll:
                      b=list(map(int,re.findall(r'\d+',scroll[0].get('bounds',''))))
                      if len(b)==4:
                          x=(b[0]+b[2])//2
                          adb('shell','input','swipe',str(x),str(b[3]-100),str(x),str(b[1]+150),'300')
                          before=shot('09-remote-drawer-scrolled')
              if match(before,'Choose repository'):
                  record('Remote repository action visibility','FAIL','Windows-only Choose repository is present and enabled in Android drawer')
                  tap('Choose repository','repository-action')
                  after=shot('10-after-choose-repository')
                  time.sleep(2)
                  later=shot('11-after-choose-repository-wait')
                  unchanged=signature(before)==signature(after)==signature(later)
                  record('Repository action outcome','FAIL' if unchanged else 'BLOCKED','No UI change or picker after native tap' if unchanged else 'UI changed; inspect trees before classification')
              else:
                  record('Remote repository action visibility','PASS','No Choose repository action found after scroll where available')
          try:
              run_case('work',work_case)
              run_case('remote',remote_case)
          finally:
              (OUT/'logcat.txt').write_text(adb('logcat','-d','-s','FreeAIAndroidQA:I','AndroidRuntime:E','Capacitor/Console:E','*:S'))
              (OUT/'crash.txt').write_text(adb('logcat','-b','crash','-d'))
              (OUT/'results.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False))
          raise SystemExit(1 if any(r['status']!='PASS' for r in rows) else 0)
          PY
          python3 -m py_compile "$RUNNER_TEMP/android-a1-native.py"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Audit main APK on Android 16 Pixel 5
        id: audit
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072M
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 "$RUNNER_TEMP/android-a1-native.py"
      - name: Upload provenance, UI trees, taps, native screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-android-a1-main-77ffab72
          path: artifacts/android-a1-77ffab72/**
          if-no-files-found: error
      - name: Enforce audit outcomes without masking blockers
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          test "$AUDIT_OUTCOME" = success
          python3 - <<'PY'
          import json
          r=json.load(open('artifacts/android-a1-77ffab72/results.json'))
          assert r and all(row['status']=='PASS' for row in r),r
          PY
          git diff --exit-code -- src electron tests scripts package.json
