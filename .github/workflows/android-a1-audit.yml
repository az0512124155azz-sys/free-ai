name: Android A1 UI Audit

on:
  push:
    branches: [audit/android-a1-ui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android_a1:
    name: Android A1 UI Audit
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        run: npm run validate

      - name: Build Android visual QA renderer
        run: npm run build:web
        env:
          VITE_VISUAL_TEST: '1'

      - name: Create and configure Android project
        run: |
          npx cap add android
          npx cap sync android
          npm run android:configure-deeplink
          npm run android:configure-branding
          npm run android:configure-signing
          npm run android:configure-social-login
          npm run android:configure-runtime-qa

      - name: Build Android A1 QA APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
          cd ..
          mkdir -p runtime-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk runtime-artifacts/free-ai-runtime-qa.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android A1 interactions on Pixel 5
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072M
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/android-a1-ui-audit.sh

      - name: Upload Android A1 screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-android-a1-audit
          path: artifacts/android-a1/**
          if-no-files-found: error

      - name: Fail if Android A1 found UI failures
        if: always()
        shell: bash
        run: |
          test -f artifacts/android-a1/results.tsv
          cat artifacts/android-a1/results.tsv
          if grep -q '^FAIL' artifacts/android-a1/results.tsv; then
            echo "::error::Android A1 found real UI failures."
            exit 1
          fi
          echo "Android A1 audit completed without real UI failures."
