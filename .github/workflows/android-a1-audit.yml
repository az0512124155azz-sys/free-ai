name: Android A1 Work Add Main Sanity

on:
  push:
    branches: [audit/android-a1-ui]
    paths: [.github/workflows/android-a1-audit.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-a1-main-4f46bdb7-work-add
  cancel-in-progress: false

env:
  AUDIT_TARGET: 4f46bdb703fc48b94ff06260f368bb4f64a3fc04
  SOURCE_RUN: '36276862931'
  SOURCE_ARTIFACT: '10917149415'

jobs:
  work_add:
    name: Main Work Add on Android 16 Pixel 5
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out exact main product commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.AUDIT_TARGET }}
          persist-credentials: false

      - name: Verify exact main APK provenance
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const repo=context.repo;
            const target=process.env.AUDIT_TARGET;
            const runId=Number(process.env.SOURCE_RUN);
            const artifactId=Number(process.env.SOURCE_ARTIFACT);

            const {data:main}=await github.rest.git.getRef({...repo,ref:'heads/main'});
            if(main.object.sha!==target){
              throw new Error('main moved; device verification must be re-audited');
            }

            const {data:run}=await github.rest.actions.getWorkflowRun({...repo,run_id:runId});
            if(run.id!==runId||run.head_sha!==target||run.head_branch!=='main'||
               run.event!=='push'||run.workflow_id!==363617952||!['in_progress','completed'].includes(run.status)||
               (run.status==='completed'&&run.conclusion!=='success')||run.run_attempt!==1){
              throw new Error('Unexpected main build provenance');
            }

            const {data:build}=await github.rest.actions.getJobForWorkflowRun({...repo,job_id:108501199706});
            if(build.run_id!==run.id||build.head_sha!==target||build.name!=='android'||
               build.status!=='completed'||build.conclusion!=='success'){
              throw new Error('Exact Android APK-producing job is not successful');
            }
            for(const name of ['Validate JavaScript','Build APK','Build runtime QA APKs','Upload Android runtime QA APK']){
              const steps=(build.steps||[]).filter(step=>step.name===name);
              if(steps.length!==1||steps[0].status!=='completed'||steps[0].conclusion!=='success'){
                throw new Error('Required Android step did not succeed: '+name);
              }
            }

            const {data:artifact}=await github.rest.actions.getArtifact({...repo,artifact_id:artifactId});
            if(artifact.id!==artifactId||artifact.name!=='free-ai-android-runtime-qa'||artifact.expired||
               artifact.workflow_run?.id!==run.id||artifact.workflow_run?.head_sha!==target){
              throw new Error('Unexpected QA APK artifact');
            }
            if(artifact.digest!=='sha256:ea23108b8263162efcca14dbd1c75a9d7aecea404b97791d160bf990b727e5a1'){
              throw new Error('QA APK artifact digest changed');
            }

            fs.mkdirSync('artifacts/android-a1-main-4f46bdb7',{recursive:true});
            fs.writeFileSync('artifacts/android-a1-main-4f46bdb7/provenance.json',JSON.stringify({
              targetSha:target,mainSha:main.object.sha,sourceRun:run.id,
              sourceRunConclusion:run.conclusion,androidBuildJob:build.id,
              artifactId:artifact.id,artifactDigest:artifact.digest,
              device:'Android API 36 Pixel 5',
              scope:'Work Add device verification only'
            },null,2));

      - name: Download immutable main QA APK
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '10917149415'
          run-id: 36276862931
          github-token: ${{ github.token }}
          path: runtime-artifacts

      - name: Prepare focused native driver
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/android-work-add.py" <<'PY'
          import hashlib, json, pathlib, re, subprocess, time, uuid
          import xml.etree.ElementTree as ET

          OUT=pathlib.Path('artifacts/android-a1-main-4f46bdb7')
          OUT.mkdir(parents=True,exist_ok=True)
          PACKAGE='com.freeai.mobile'
          rows=[]
          serials=[line.split()[0] for line in subprocess.check_output(['adb','devices'],text=True).splitlines()[1:] if line.endswith('\tdevice')]
          if len(serials)!=1: raise RuntimeError('Expected exactly one emulator: '+repr(serials))
          SERIAL=serials[0]
          capture_seq=0
          last_xml=None

          def adb(*args,binary=False,timeout=25):
              return subprocess.check_output(['adb','-s',SERIAL,*args],timeout=timeout,text=not binary)

          def norm(value):
              return ' '.join(str(value or '').split()).strip()

          def labels_for(node):
              return [norm(node.get('text','')),norm(node.get('content-desc',''))]

          def visible_enabled(node):
              if node.get('enabled')=='false': return False
              bounds=list(map(int,re.findall(r'\d+',node.get('bounds',''))))
              return len(bounds)==4 and bounds[2]>bounds[0] and bounds[3]>bounds[1]

          def action_nodes(nodes,title):
              prefix=title+' '
              found=[]
              for node in nodes:
                  if not visible_enabled(node): continue
                  values=[v for v in labels_for(node) if v]
                  if any(v==title or v.startswith(prefix) for v in values):
                      found.append(node)
              return found

          def dump(name,deadline=None):
              nonlocal_dummy=None
              global capture_seq,last_xml
              end=deadline or (time.monotonic()+25)
              capture_seq+=1
              rootdir=OUT/'ui-dumps'/f'{capture_seq:02d}-{name}-{uuid.uuid4().hex}'
              rootdir.mkdir(parents=True,exist_ok=False)
              last='no fresh UI hierarchy'
              for attempt in range(1,6):
                  if time.monotonic()>=end: break
                  folder=rootdir/f'attempt-{attempt}'
                  folder.mkdir()
                  remote=f'/sdcard/freeai-main-4f46bdb7-{uuid.uuid4().hex}.xml'
                  try:
                      subprocess.run(['adb','-s',SERIAL,'shell','rm','-f',remote],check=False,capture_output=True,timeout=8)
                      gen=subprocess.run(['adb','-s',SERIAL,'shell','uiautomator','dump',remote],check=False,capture_output=True,timeout=12)
                      read=subprocess.run(['adb','-s',SERIAL,'exec-out','cat',remote],check=False,capture_output=True,timeout=8)
                      (folder/'dump.stdout').write_bytes(gen.stdout)
                      (folder/'dump.stderr').write_bytes(gen.stderr)
                      (folder/'raw.xml').write_bytes(read.stdout)
                      diagnostics=(gen.stdout+b'\n'+gen.stderr).decode('utf-8',errors='replace')
                      if gen.returncode or read.returncode: raise RuntimeError('dump/read command failed')
                      if re.search(r'ERROR:|null root node|could not get idle state',diagnostics,re.I):
                          raise RuntimeError('UIAutomator reported capture failure')
                      if not read.stdout.strip(): raise RuntimeError('empty XML')
                      tree=ET.fromstring(read.stdout)
                      nodes=list(tree.iter('node'))
                      if tree.tag!='hierarchy' or not nodes: raise RuntimeError('invalid hierarchy')
                      last_xml=str((folder/'raw.xml').relative_to(OUT))
                      (folder/'accepted.json').write_text(json.dumps({
                        'accepted':True,'name':name,'attempt':attempt,'remotePath':remote,
                        'sha256':hashlib.sha256(read.stdout).hexdigest(),'nodeCount':len(nodes)
                      },indent=2))
                      return nodes
                  except Exception as exc:
                      last=str(exc)
                      (folder/'rejected.txt').write_text(last)
                      if time.monotonic()<end: time.sleep(0.5)
              raise RuntimeError('Fresh UI tree unavailable for '+name+': '+last)

          def find(nodes,title):
              matches=action_nodes(nodes,title)
              if not matches: return None
              node=matches[0]
              b=list(map(int,re.findall(r'\d+',node.get('bounds',''))))
              return node,b

          def wait_text(title,name,seconds=30):
              end=time.monotonic()+seconds
              while time.monotonic()<end:
                  nodes=dump(name,deadline=end)
                  if find(nodes,title): return nodes
                  time.sleep(0.5)
              raise RuntimeError('UI target not found: '+title)

          def tap(title,name):
              nodes=wait_text(title,name+'-before')
              node,(x1,y1,x2,y2)=find(nodes,title)
              x,y=(x1+x2)//2,(y1+y2)//2
              with (OUT/'taps.jsonl').open('a') as f:
                  f.write(json.dumps({'target':title,'xml':last_xml,'bounds':node.get('bounds'),'center':[x,y]})+'\n')
              adb('shell','input','tap',str(x),str(y))
              time.sleep(0.8)

          def screenshot(name):
              (OUT/(name+'.png')).write_bytes(adb('exec-out','screencap','-p',binary=True))
              return dump(name)

          def record(name,status,detail):
              rows.append({'name':name,'status':status,'detail':detail})
              (OUT/'results.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False))
              print(status,name,detail,flush=True)

          apk=next(pathlib.Path('runtime-artifacts').rglob('free-ai-runtime-qa.apk'))
          (OUT/'apk-sha256.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'\n')
          (OUT/'device.txt').write_text(
              adb('shell','getprop','ro.build.version.release')+
              adb('shell','getprop','ro.build.version.sdk')+
              adb('shell','wm','size')
          )
          adb('install','-r',str(apk))
          adb('logcat','-c')
          adb('shell','am','force-stop',PACKAGE)
          adb('shell','am','start','-W','-n',PACKAGE+'/.MainActivity')
          wait_text('Open navigation','launch-ready',40)

          wait_text('Free AI · Chat','chat-ready')
          screenshot('01-chat')
          tap('Free AI · Chat','mode-menu')
          wait_text('Work','mode-menu-open')
          screenshot('02-mode-menu')
          tap('Work','select-work')
          wait_text('Free AI · Work','work-ready')
          screenshot('03-work')
          tap('Add','open-work-add')
          wait_text('Files','work-add-open')
          nodes=screenshot('04-work-add')

          expected={}
          for title in ['Camera','Photos','Files']:
              matches=action_nodes(nodes,title)
              expected[title]=len(matches)
              if len(matches)!=1:
                  record(title+' action','FAIL','expected exactly one visible enabled action, found '+str(len(matches)))
              else:
                  record(title+' action','PASS','exactly one visible enabled action')

          attach=action_nodes(nodes,'Attach files')
          if attach:
              record('Attach files absent','FAIL','found '+str(len(attach))+' visible enabled Attach files action(s)')
          else:
              record('Attach files absent','PASS','no visible enabled Attach files action')

          visible_labels=sorted({
              value for node in nodes if visible_enabled(node)
              for value in labels_for(node) if value
          })
          (OUT/'work-add-labels.json').write_text(json.dumps(visible_labels,indent=2,ensure_ascii=False))
          (OUT/'work-add-summary.json').write_text(json.dumps({
              'Camera':expected.get('Camera',0),'Photos':expected.get('Photos',0),
              'Files':expected.get('Files',0),'Attach files':len(attach),
              'acceptedXml':last_xml
          },indent=2))

          (OUT/'logcat.txt').write_text(adb('logcat','-d'))
          (OUT/'crash.txt').write_text(adb('logcat','-b','crash','-d'))

          if any(row['status']!='PASS' for row in rows):
              raise SystemExit(1)
          PY
          python3 -m py_compile "$RUNNER_TEMP/android-work-add.py"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify Work Add on Android 16 Pixel 5
        id: verify
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072M
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 "$RUNNER_TEMP/android-work-add.py"

      - name: Upload focused Work Add evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-main-4f46bdb7-android-work-add-device
          path: artifacts/android-a1-main-4f46bdb7/**
          if-no-files-found: error

      - name: Enforce focused device result
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          test "$VERIFY_OUTCOME" = success
          python3 - <<'PY'
          import json
          rows=json.load(open('artifacts/android-a1-main-4f46bdb7/results.json'))
          assert len(rows)==4,rows
          assert all(row['status']=='PASS' for row in rows),rows
          summary=json.load(open('artifacts/android-a1-main-4f46bdb7/work-add-summary.json'))
          assert summary['Camera']==1,summary
          assert summary['Photos']==1,summary
          assert summary['Files']==1,summary
          assert summary['Attach files']==0,summary
          PY
          git diff --exit-code -- src electron tests scripts package.json
