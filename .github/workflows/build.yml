name: Build Free AI

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the final GitHub Release
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: free-ai-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            artifact_path: release/*.exe
          - os: macos-latest
            artifact: macos
            artifact_path: release/*.dmg
          - os: ubuntu-latest
            artifact: linux
            artifact_path: release/*.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - id: windows_signing
        name: Check Windows signing readiness
        if: matrix.artifact == 'windows'
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          REQUIRE_WINDOWS_SIGNING: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)

          if ($hasCertificate -xor $hasPassword) {
            throw 'Windows signing is only partially configured. Set both WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD, or neither for an unsigned development build.'
          }

          if ($env:REQUIRE_WINDOWS_SIGNING -eq 'true' -and -not $hasCertificate) {
            throw 'Release publishing requires Windows Authenticode signing. Configure WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD before publishing.'
          }

          $enabled = $hasCertificate.ToString().ToLowerInvariant()
          "enabled=$enabled" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($hasCertificate) {
            Write-Host 'Windows Authenticode signing credentials detected. electron-builder will sign the Windows executable and NSIS installer.'
          } else {
            Write-Host 'Windows signing credentials are not configured. Continuing with an unsigned development/CI build.'
          }

      - id: desktop_build
        name: Build desktop app
        continue-on-error: true
        run: node scripts/ci-desktop-build.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Report desktop build failure
        if: steps.desktop_build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = fs.existsSync('desktop-build.log')
              ? fs.readFileSync('desktop-build.log', 'utf8')
              : 'No log file was created.';
            if (log.length > 50000) log = log.slice(-50000);

            const title = 'CI diagnostic: desktop build failed on ${{ matrix.artifact }}';
            const body = [
              'Automated diagnostic from workflow run ' + context.runId + '.',
              '',
              'Commit: ' + context.sha,
              '',
              '~~~text',
              log,
              '~~~'
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-diagnostic']
              });
            }

      - name: Close stale desktop diagnostic
        if: steps.desktop_build.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'CI diagnostic: desktop build failed on ${{ matrix.artifact }}';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                state: 'closed'
              });
            }

      - name: Fail job after diagnostic
        if: steps.desktop_build.outcome == 'failure'
        run: node -e "process.exit(1)"

      - name: Windows clean install and first-launch smoke
        if: steps.desktop_build.outcome == 'success' && matrix.artifact == 'windows'
        shell: pwsh
        env:
          FREEAI_EXPECT_SIGNED: ${{ steps.windows_signing.outputs.enabled }}
        run: ./scripts/windows7-installer-smoke.ps1

      - uses: actions/upload-artifact@v4
        if: steps.desktop_build.outcome == 'success'
        with:
          name: free-ai-${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  windows_visual:
    name: Windows visual regression
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Install pinned Playwright test driver
        run: npm install --no-save --no-package-lock @playwright/test@1.63.0

      - name: Build deterministic visual-test renderer
        run: npm run build:web
        env:
          VITE_VISUAL_TEST: '1'

      - name: Run Windows visual regression
        shell: pwsh
        run: npx playwright test --config=playwright.windows.config.mjs

      - name: Upload Windows visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-windows-visual
          path: |
            tests/visual/baselines/*.png
            artifacts/windows-visual/**
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        run: npm run validate

      - name: Build web app
        run: npm run build:web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Google OAuth deep link
        run: npm run android:configure-deeplink

      - name: Apply Free AI Android branding
        run: npm run android:configure-branding

      - name: Configure stable Android OAuth signing
        run: npm run android:configure-signing

      - name: Configure native Google login MainActivity
        run: npm run android:configure-social-login

      - name: Verify Android signing fingerprint
        run: chmod +x android/gradlew && cd android && ./gradlew signingReport && cd .. && cat android-oauth-info.txt

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Build runtime QA APKs
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/free-ai-app-debug.apk"

          VITE_ANDROID_AUTH_QA=1 npm run build:web
          npx cap copy android
          npm run android:configure-runtime-qa
          cd android
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/free-ai-auth-runtime-qa.apk

          VITE_VISUAL_TEST=1 npm run build:web
          npx cap copy android
          npm run android:configure-runtime-qa
          cd android
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/free-ai-runtime-qa.apk
          cp "$RUNNER_TEMP/free-ai-app-debug.apk" android/app/build/outputs/apk/debug/app-debug.apk
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: free-ai-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-oauth-info.txt
          if-no-files-found: error

      - name: Upload Android runtime QA APK
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-android-runtime-qa
          path: android/app/build/outputs/apk/debug/free-ai-runtime-qa.apk
          if-no-files-found: error

      - name: Upload Android auth runtime QA APK
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-android-auth-runtime-qa
          path: android/app/build/outputs/apk/debug/free-ai-auth-runtime-qa.apk
          if-no-files-found: error

  android_runtime:
    name: Android runtime (${{ matrix.form_factor }})
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - form_factor: phone
            profile: pixel_7_pro
          - form_factor: tablet
            profile: pixel_tablet

    steps:
      - uses: actions/checkout@v4

      - name: Download Android runtime QA build
        uses: actions/download-artifact@v4
        with:
          name: free-ai-android-runtime-qa
          path: runtime-artifacts

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android 16 runtime QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          cores: 2
          ram-size: 3072M
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/android-runtime-qa.sh ${{ matrix.form_factor }}

      - name: Upload Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-android-runtime-${{ matrix.form_factor }}
          path: artifacts/android-runtime/${{ matrix.form_factor }}
          if-no-files-found: warn

  android_auth_runtime:
    name: Android auth runtime (email/session)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - id: auth_config
        name: Inspect public Supabase auth configuration
        shell: bash
        run: |
          public_config_file="$RUNNER_TEMP/free-ai-public-auth-config"
          node - "$public_config_file" <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('src/main.jsx', 'utf8');
          const url = source.match(/const supabaseUrl=import\.meta\.env\.VITE_SUPABASE_URL\|\|'([^']+)'/)?.[1] || '';
          const key = source.match(/const supabaseKey=import\.meta\.env\.VITE_SUPABASE_ANON_KEY\|\|'([^']+)'/)?.[1] || '';
          if (!url || !key || !key.startsWith('sb_publishable_')) {
            console.error('Unable to resolve the app public Supabase fallback configuration.');
            process.exit(1);
          }
          fs.writeFileSync(process.argv[2], JSON.stringify({ url, key }));
          NODE

          SUPABASE_URL_FOR_QA="$VITE_SUPABASE_URL"
          SUPABASE_KEY_FOR_QA="$VITE_SUPABASE_ANON_KEY"
          if [[ -z "$SUPABASE_URL_FOR_QA" || -z "$SUPABASE_KEY_FOR_QA" ]]; then
            SUPABASE_URL_FOR_QA="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).url" "$public_config_file")"
            SUPABASE_KEY_FOR_QA="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).key" "$public_config_file")"
            echo "::notice::Android auth QA is using the same public Supabase fallback configuration bundled by the app."
          fi

          settings_file="$RUNNER_TEMP/free-ai-auth-settings.json"
          http_code="$(curl --silent --show-error --output "$settings_file" --write-out '%{http_code}' \
            --header "apikey: $SUPABASE_KEY_FOR_QA" \
            "$SUPABASE_URL_FOR_QA/auth/v1/settings")"

          if [[ "$http_code" != "200" ]]; then
            echo "::error::Supabase /auth/v1/settings returned HTTP $http_code."
            exit 1
          fi

          node - "$settings_file" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const [settingsPath, outputPath] = process.argv.slice(2);
          const settings = JSON.parse(fs.readFileSync(settingsPath, 'utf8'));
          const disableSignup = settings.disable_signup === true;
          const autoConfirm = settings.mailer_autoconfirm === true || settings.autoconfirm === true;
          const googleEnabled = settings.external?.google === true;
          fs.appendFileSync(outputPath,
            `disable_signup=${disableSignup}\nmailer_autoconfirm=${autoConfirm}\ngoogle_enabled=${googleEnabled}\n`);
          console.log(`Supabase Auth: signup=${disableSignup ? 'disabled' : 'enabled'}, email_autoconfirm=${autoConfirm ? 'enabled' : 'disabled'}, google=${googleEnabled ? 'enabled' : 'disabled'}`);
          NODE

      - id: github_oidc
        name: Verify GitHub OIDC trust with Supabase
        shell: bash
        run: |
          oidc_response="$RUNNER_TEMP/free-ai-github-oidc.json"
          oidc_token_file="$RUNNER_TEMP/free-ai-github-oidc-token"
          broker_response="$RUNNER_TEMP/free-ai-oidc-broker-response.json"

          curl --silent --show-error --fail \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=free-ai-android-auth-qa" \
            --output "$oidc_response"

          node - "$oidc_response" "$oidc_token_file" <<'NODE'
          const fs = require('node:fs');
          const [responsePath, tokenPath] = process.argv.slice(2);
          const response = JSON.parse(fs.readFileSync(responsePath, 'utf8'));
          if (!response.value || typeof response.value !== 'string') {
            console.error('GitHub OIDC token response did not contain a token.');
            process.exit(1);
          }
          fs.writeFileSync(tokenPath, response.value, { mode: 0o600 });
          NODE

          http_code="$(curl --silent --show-error \
            --output "$broker_response" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $(cat "$oidc_token_file")" \
            "https://xquntkgjlmrxkwkrwsjl.supabase.co/functions/v1/free-ai-ci-oidc-check")"

          rm -f "$oidc_response" "$oidc_token_file"

          if [[ "$http_code" != "200" ]]; then
            echo "::error::Supabase GitHub OIDC verifier returned HTTP $http_code."
            cat "$broker_response"
            exit 1
          fi

          node - "$broker_response" <<'NODE'
          const fs = require('node:fs');
          const response = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (response.ok !== true) {
            console.error('Supabase GitHub OIDC verifier rejected the workflow identity.');
            process.exit(1);
          }
          console.log('GitHub OIDC trust verified by Supabase Edge Function.');
          NODE

      - id: provision_qa_account
        name: Provision ephemeral Android auth QA account
        shell: bash
        run: |
          qa_password="Qa1!$(openssl rand -hex 32)"
          echo "::add-mask::$qa_password"

          oidc_response="$RUNNER_TEMP/free-ai-provision-oidc.json"
          oidc_token_file="$RUNNER_TEMP/free-ai-provision-oidc-token"
          provision_body="$RUNNER_TEMP/free-ai-provision-body.json"
          provision_response="$RUNNER_TEMP/free-ai-provision-response.json"

          curl --silent --show-error --fail \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=free-ai-android-auth-qa" \
            --output "$oidc_response"

          node - "$oidc_response" "$oidc_token_file" <<'NODE'
          const fs = require('node:fs');
          const [responsePath, tokenPath] = process.argv.slice(2);
          const response = JSON.parse(fs.readFileSync(responsePath, 'utf8'));
          if (!response.value || typeof response.value !== 'string') {
            console.error('GitHub OIDC token response did not contain a token.');
            process.exit(1);
          }
          fs.writeFileSync(tokenPath, response.value, { mode: 0o600 });
          NODE

          printf '%s' "$qa_password" > "$RUNNER_TEMP/free-ai-qa-password"
          node - "$RUNNER_TEMP/free-ai-qa-password" "$provision_body" <<'NODE'
          const fs = require('node:fs');
          const [passwordPath, bodyPath] = process.argv.slice(2);
          const password = fs.readFileSync(passwordPath, 'utf8');
          fs.writeFileSync(bodyPath, JSON.stringify({ password }), { mode: 0o600 });
          NODE

          http_code="$(curl --silent --show-error \
            --output "$provision_response" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $(cat "$oidc_token_file")" \
            --header "Content-Type: application/json" \
            --data-binary "@$provision_body" \
            "https://xquntkgjlmrxkwkrwsjl.supabase.co/functions/v1/free-ai-ci-auth-provision")"

          rm -f "$oidc_response" "$oidc_token_file" "$provision_body" "$RUNNER_TEMP/free-ai-qa-password"

          if [[ "$http_code" != "200" ]]; then
            echo "::error::Supabase QA account provisioner returned HTTP $http_code."
            cat "$provision_response"
            exit 1
          fi

          qa_email="$(node - "$provision_response" <<'NODE'
          const fs = require('node:fs');
          const response = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (response.ok !== true || typeof response.email !== 'string' || !response.email) {
            console.error('Supabase QA account provisioner did not return a valid account.');
            process.exit(1);
          }
          process.stdout.write(response.email);
          NODE
          )"

          echo "::add-mask::$qa_email"
          {
            echo "ANDROID_AUTH_TEST_EMAIL=$qa_email"
            echo "ANDROID_AUTH_TEST_PASSWORD=$qa_password"
          } >> "$GITHUB_ENV"

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Ephemeral Android auth QA account provisioned for this workflow run."

      - name: Download Android auth runtime QA build
        if: steps.provision_qa_account.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: free-ai-android-auth-runtime-qa
          path: runtime-artifacts

      - name: Enable KVM
        if: steps.provision_qa_account.outputs.configured == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android 16 email/session auth QA
        if: steps.provision_qa_account.outputs.configured == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          ram-size: 3072M
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/android-auth-runtime-qa.sh

      - name: Upload Android auth runtime evidence
        if: always() && steps.provision_qa_account.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-android-auth-runtime-email-session
          path: artifacts/android-auth-runtime
          if-no-files-found: warn

  extension:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate extension JavaScript
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js

      - name: Package extension
        run: cd extension && zip -r ../free-ai-extension.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: free-ai-chrome-extension
          path: free-ai-extension.zip
          if-no-files-found: error


  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release == true
    needs: [desktop, windows_visual, android, android_runtime, extension]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: free-ai-windows
          path: release-assets

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: free-ai-macos
          path: release-assets

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: free-ai-linux
          path: release-assets

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: free-ai-android
          path: release-assets

      - name: Download Chrome extension
        uses: actions/download-artifact@v4
        with:
          name: free-ai-chrome-extension
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          TITLE="Free AI v$VERSION"

          mapfile -d '' ASSETS < <(find release-assets -type f -print0)

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No release assets found."
            exit 1
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "Free AI desktop, Android and Chrome extension builds."
          fi

          gh release upload "$TAG" "${ASSETS[@]}" --clobber
