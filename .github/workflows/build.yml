  extension:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate extension JavaScript
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js

      - name: Package extension
        run: cd extension && zip -r ../free-ai-extension.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: free-ai-chrome-extension
          path: free-ai-extension.zip
          if-no-files-found: error


  release_validation:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.validate_release == true && inputs.publish_release != true))
    needs: [release_mode_guard, desktop, windows_visual, android, android_runtime, android_auth_runtime, android_google_runtime, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: free-ai-windows
          path: release-assets

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: free-ai-macos
          path: release-assets

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: free-ai-linux
          path: release-assets

      - name: Download signed Android APK
        uses: actions/download-artifact@v4
        with:
          name: free-ai-android-release
          path: release-assets

      - name: Download Chrome extension
        uses: actions/download-artifact@v4
        with:
          name: free-ai-chrome-extension
          path: release-assets

      - name: Validate release candidate without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"

          expected=(
            "Free-AI-Windows-$VERSION.exe"
            "Free-AI-macOS-$VERSION.dmg"
            "Free-AI-Linux-$VERSION.AppImage"
            "Free-AI-Android-$VERSION.apk"
            "free-ai-extension.zip"
          )

          for name in "${expected[@]}"; do
            test -f "release-assets/$name" || {
              echo "Missing expected release candidate asset: $name" >&2
              exit 1
            }
          done

          mapfile -d '' files < <(find release-assets -type f -print0)
          if [[ "${#files[@]}" -ne "${#expected[@]}" ]]; then
            echo "Unexpected release candidate asset count: ${#files[@]} (expected ${#expected[@]})." >&2
            find release-assets -type f -print
            exit 1
          fi

          if find release-assets -type f \( -iname '*debug*' -o -name 'android-oauth-info.txt' \) | grep -q .; then
            echo "Debug/QA Android files must never enter a production release candidate." >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Increment package.json before validating another release candidate." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Existing releases are immutable for this workflow." >&2
            exit 1
          fi

          (
            cd release-assets
            sha256sum "${expected[@]}" > SHA256SUMS.txt
          )

          echo "Release candidate $TAG validated without creating a tag or GitHub Release."

      - name: Upload validated release candidate
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-release-candidate
          path: release-assets/*
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release == true
    needs: [release_mode_guard, desktop, windows_visual, android, android_runtime, android_auth_runtime, android_google_runtime, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: free-ai-windows
          path: release-assets

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: free-ai-macos
          path: release-assets

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: free-ai-linux
          path: release-assets

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: free-ai-android-release
          path: release-assets

      - name: Download Chrome extension
        uses: actions/download-artifact@v4
        with:
          name: free-ai-chrome-extension
          path: release-assets

      - name: Verify release assets and tag availability
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"

          expected=(
            "Free-AI-Windows-$VERSION.exe"
            "Free-AI-macOS-$VERSION.dmg"
            "Free-AI-Linux-$VERSION.AppImage"
            "Free-AI-Android-$VERSION.apk"
            "free-ai-extension.zip"
          )

          for name in "${expected[@]}"; do
            test -f "release-assets/$name" || {
              echo "Missing expected release asset: $name" >&2
              exit 1
            }
          done

          mapfile -d '' files < <(find release-assets -type f -print0)
          if [[ "${#files[@]}" -ne "${#expected[@]}" ]]; then
            echo "Unexpected release asset count: ${#files[@]} (expected ${#expected[@]})." >&2
            find release-assets -type f -print
            exit 1
          fi

          if find release-assets -type f \( -iname '*debug*' -o -name 'android-oauth-info.txt' \) | grep -q .; then
            echo "Debug/QA Android files must never be published in a production release." >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Increment package.json instead of overwriting a published version." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Existing releases are immutable for this workflow." >&2
            exit 1
          fi

          (
            cd release-assets
            sha256sum "${expected[@]}" > SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_UNSIGNED_MACOS: ${{ inputs.allow_unsigned_macos }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          TITLE="Free AI v$VERSION"

          mapfile -d '' ASSETS < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          if [[ "${#ASSETS[@]}" -ne 6 ]]; then
            echo "Expected 6 final release files including SHA256SUMS.txt; found ${#ASSETS[@]}." >&2
            exit 1
          fi

          EXTRA_NOTES=""
          if [[ "${ALLOW_UNSIGNED_MACOS:-false}" == true ]]; then
            printf -v EXTRA_NOTES '%s\n\n%s\n' \
              '⚠️ macOS signing notice' \
              'The macOS DMG in this release is intentionally unsigned and not notarized. macOS Gatekeeper may warn or block it. Windows signing is optional; Android release signing remains required.'
          fi

          gh release create "$TAG" "${ASSETS[@]}" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "$EXTRA_NOTES" \
            --generate-notes
