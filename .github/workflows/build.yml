name: Build Free AI

on:
  workflow_dispatch:
    inputs:
      validate_release:
        description: Validate production signing and release assets without publishing
        required: false
        type: boolean
        default: false
      publish_release:
        description: Publish the final GitHub Release
        required: false
        type: boolean
        default: false
      allow_unsigned_macos:
        description: Explicitly allow an unsigned/not-notarized macOS DMG for this release
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: free-ai-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release_mode_guard:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject conflicting release modes
        shell: bash
        env:
          VALIDATE_RELEASE: ${{ inputs.validate_release }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          ALLOW_UNSIGNED_MACOS: ${{ inputs.allow_unsigned_macos }}
        run: |
          set -euo pipefail
          if [[ "$VALIDATE_RELEASE" == "true" && "$PUBLISH_RELEASE" == "true" ]]; then
            echo "Choose either validate_release or publish_release, not both." >&2
            exit 1
          fi
          if [[ "$ALLOW_UNSIGNED_MACOS" == "true" && "$VALIDATE_RELEASE" != "true" && "$PUBLISH_RELEASE" != "true" ]]; then
            echo "allow_unsigned_macos is only valid with validate_release or publish_release." >&2
            exit 1
          fi
          echo "Release mode selection is valid."

  release_credentials_status:
    name: Production credential readiness
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      ANDROID_RELEASE_EXPECTED_SHA1: ${{ secrets.ANDROID_RELEASE_EXPECTED_SHA1 }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
    steps:
      - name: Report production credential presence
        shell: bash
        run: |
          set -euo pipefail

          count_present() {
            local count=0
            local name
            for name in "$@"; do
              [[ -n "${!name:-}" ]] && count=$((count+1))
            done
            printf '%s' "$count"
          }

          group_status() {
            local present="$1"
            local required="$2"
            if [[ "$present" -eq 0 ]]; then
              printf 'MISSING'
            elif [[ "$present" -eq "$required" ]]; then
              printf 'READY'
            else
              printf 'PARTIAL'
            fi
          }

          windows_present="$(count_present WIN_CSC_LINK WIN_CSC_KEY_PASSWORD)"
          windows_status="$(group_status "$windows_present" 2)"

          mac_sign_present="$(count_present MAC_CSC_LINK MAC_CSC_KEY_PASSWORD)"
          mac_sign_status="$(group_status "$mac_sign_present" 2)"
          mac_api_present="$(count_present APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER)"
          mac_apple_id_present="$(count_present APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID)"
          if [[ "$mac_api_present" -eq 3 || "$mac_apple_id_present" -eq 3 ]]; then
            mac_notary_status='READY'
          elif [[ "$mac_api_present" -eq 0 && "$mac_apple_id_present" -eq 0 ]]; then
            mac_notary_status='MISSING'
          else
            mac_notary_status='PARTIAL'
          fi
          if [[ "$mac_sign_status" == 'READY' && "$mac_notary_status" == 'READY' ]]; then
            mac_status='READY'
          elif [[ "$mac_sign_status" == 'MISSING' && "$mac_notary_status" == 'MISSING' ]]; then
            mac_status='MISSING'
          else
            mac_status='PARTIAL'
          fi

          android_present="$(count_present             ANDROID_RELEASE_KEYSTORE_BASE64             ANDROID_RELEASE_STORE_PASSWORD             ANDROID_RELEASE_KEY_ALIAS             ANDROID_RELEASE_KEY_PASSWORD             ANDROID_RELEASE_EXPECTED_SHA1)"
          android_status="$(group_status "$android_present" 5)"

          auth_present="$(count_present VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_GOOGLE_WEB_CLIENT_ID)"
          auth_status="$(group_status "$auth_present" 3)"

          echo "release_credentials_status windows=$windows_status macos=$mac_status android=$android_status auth=$auth_status"
          {
            echo '### Production credential readiness (presence only)'
            echo
            echo '| Group | Status |'
            echo '| --- | --- |'
            echo "| Windows Authenticode | $windows_status |"
            echo "| macOS Developer ID + notarization | $mac_status |"
            echo "| Android production signing | $android_status |"
            echo "| Supabase + Google public build config | $auth_status |"
            echo
            echo 'No secret values are printed by this job. A READY status only confirms that the required secret fields are non-empty; the production dry-run validates the credentials themselves.'
          } >> "$GITHUB_STEP_SUMMARY"

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            artifact_path: release/*.exe
          - os: macos-latest
            artifact: macos
            artifact_path: release/*.dmg
          - os: ubuntu-latest
            artifact: linux
            artifact_path: release/*.AppImage

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Linux Whisper build toolchain
        if: matrix.artifact == 'linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Validate PowerShell release and Google QA helpers
        if: matrix.artifact == 'windows'
        shell: powershell
        run: |
          $scripts = @(
            @{
              Path = 'scripts/android-google-real-account-qa.ps1'
              RequiredParameters = @('Apk', 'Serial', 'OutputDir')
            },
            @{
              Path = 'scripts/setup-release-credentials.ps1'
              RequiredParameters = @('Target', 'Repository')
            }
          )

          foreach ($script in $scripts) {
            $scriptPath = (Resolve-Path $script.Path).Path
            $tokens = $null
            $errors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath,
              [ref]$tokens,
              [ref]$errors
            )

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("PowerShell parse error in {0} at line {1}, column {2}: {3}" -f $script.Path, $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
              }
              throw "PowerShell parser validation failed: $($script.Path)"
            }

            $parameterNames = @(
              $ast.ParamBlock.Parameters | ForEach-Object {
                $_.Name.VariablePath.UserPath
              }
            )

            foreach ($required in $script.RequiredParameters) {
              if ($parameterNames -notcontains $required) {
                throw "$($script.Path) is missing required parameter: $required"
              }
            }

            Write-Host "PowerShell parser validation passed: $($script.Path)"
          }

      - id: windows_signing
        name: Check Windows signing readiness
        if: matrix.artifact == 'windows'
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          REQUIRE_WINDOWS_SIGNING: 'false'
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)

          if ($hasCertificate -xor $hasPassword) {
            throw 'Windows signing is only partially configured. Set both WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD, or neither for an unsigned development build.'
          }

          $enabled = $hasCertificate.ToString().ToLowerInvariant()
          "enabled=$enabled" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($hasCertificate) {
            Write-Host 'Windows Authenticode signing credentials detected. electron-builder will sign the Windows executable and NSIS installer.'
          } else {
            Write-Host 'Windows signing credentials are not configured. Continuing with an unsigned build; Windows signing is optional for Free AI releases.'
          }

      - id: macos_distribution
        name: Check macOS signing and notarization readiness
        if: matrix.artifact == 'macos'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          REQUIRE_MAC_DISTRIBUTION: ${{ github.event_name == 'workflow_dispatch' && (inputs.validate_release == true || inputs.publish_release == true) }}
          ALLOW_UNSIGNED_MACOS: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unsigned_macos == true }}
        run: |
          set -euo pipefail

          sign_link=false
          sign_password=false
          [[ -n "${MAC_CSC_LINK:-}" ]] && sign_link=true
          [[ -n "${MAC_CSC_KEY_PASSWORD:-}" ]] && sign_password=true
          if [[ "$sign_link" != "$sign_password" ]]; then
            echo "macOS signing is only partially configured. Set both MAC_CSC_LINK and MAC_CSC_KEY_PASSWORD, or neither for an unsigned development build." >&2
            exit 1
          fi

          api_key=false
          api_id=false
          api_issuer=false
          [[ -n "${APPLE_API_KEY_BASE64:-}" ]] && api_key=true
          [[ -n "${APPLE_API_KEY_ID:-}" ]] && api_id=true
          [[ -n "${APPLE_API_ISSUER:-}" ]] && api_issuer=true
          api_count=0
          [[ "$api_key" == true ]] && api_count=$((api_count+1))
          [[ "$api_id" == true ]] && api_count=$((api_count+1))
          [[ "$api_issuer" == true ]] && api_count=$((api_count+1))
          if [[ "$api_count" -ne 0 && "$api_count" -ne 3 ]]; then
            echo "App Store Connect notarization is only partially configured. Set APPLE_API_KEY_BASE64, APPLE_API_KEY_ID, and APPLE_API_ISSUER together." >&2
            exit 1
          fi

          apple_id=false
          apple_password=false
          apple_team=false
          [[ -n "${APPLE_ID:-}" ]] && apple_id=true
          [[ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]] && apple_password=true
          [[ -n "${APPLE_TEAM_ID:-}" ]] && apple_team=true
          apple_count=0
          [[ "$apple_id" == true ]] && apple_count=$((apple_count+1))
          [[ "$apple_password" == true ]] && apple_count=$((apple_count+1))
          [[ "$apple_team" == true ]] && apple_count=$((apple_count+1))
          if [[ "$apple_count" -ne 0 && "$apple_count" -ne 3 ]]; then
            echo "Apple ID notarization is only partially configured. Set APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID together." >&2
            exit 1
          fi

          signed=false
          if [[ "$sign_link" == true ]]; then
            signed=true
            {
              echo 'CSC_LINK<<FREEAI_CSC_EOF'
              printf '%s\n' "$MAC_CSC_LINK"
              echo 'FREEAI_CSC_EOF'
              echo 'CSC_KEY_PASSWORD<<FREEAI_CSC_PASSWORD_EOF'
              printf '%s\n' "$MAC_CSC_KEY_PASSWORD"
              echo 'FREEAI_CSC_PASSWORD_EOF'
            } >> "$GITHUB_ENV"
          fi

          notarized=false
          if [[ "$api_count" -eq 3 ]]; then
            notarized=true
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$key_path"
            chmod 600 "$key_path"
            {
              echo "APPLE_API_KEY=$key_path"
              echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            } >> "$GITHUB_ENV"
          elif [[ "$apple_count" -eq 3 ]]; then
            notarized=true
            {
              echo 'APPLE_ID<<FREEAI_APPLE_ID_EOF'
              printf '%s\n' "$APPLE_ID"
              echo 'FREEAI_APPLE_ID_EOF'
              echo 'APPLE_APP_SPECIFIC_PASSWORD<<FREEAI_APP_PASSWORD_EOF'
              printf '%s\n' "$APPLE_APP_SPECIFIC_PASSWORD"
              echo 'FREEAI_APP_PASSWORD_EOF'
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          fi

          if [[ "$notarized" == true && "$signed" != true ]]; then
            echo "macOS notarization credentials are configured without Developer ID signing credentials." >&2
            exit 1
          fi
          if [[ "${REQUIRE_MAC_DISTRIBUTION:-false}" == true && ( "$signed" != true || "$notarized" != true ) ]]; then
            if [[ "${ALLOW_UNSIGNED_MACOS:-false}" == true && "$signed" == false && "$notarized" == false ]]; then
              echo "::warning::Explicit unsigned macOS exception enabled. The DMG will not have Developer ID signing or Apple notarization and may be blocked or warned by Gatekeeper."
            else
              echo "Release validation/publishing requires both Developer ID signing and Apple notarization. Configure MAC_CSC_LINK/MAC_CSC_KEY_PASSWORD plus one complete notarization credential set, or explicitly choose allow_unsigned_macos for an unsigned DMG." >&2
              exit 1
            fi
          fi

          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "notarized=$notarized" >> "$GITHUB_OUTPUT"
          echo "FREEAI_MAC_NOTARIZE=$notarized" >> "$GITHUB_ENV"

          if [[ "$signed" == true ]]; then
            echo "Developer ID signing credentials detected."
          else
            echo "No macOS signing credentials detected; continuing with an unsigned development/CI build."
          fi
          if [[ "$notarized" == true ]]; then
            echo "Apple notarization credentials detected; electron-builder notarization is enabled."
          else
            echo "No notarization credentials detected; notarization is disabled for this development/CI build."
          fi

      - id: desktop_build
        name: Build desktop app
        continue-on-error: true
        run: node scripts/ci-desktop-build.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Report desktop build failure
        if: steps.desktop_build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = fs.existsSync('desktop-build.log')
              ? fs.readFileSync('desktop-build.log', 'utf8')
              : 'No log file was created.';
            if (log.length > 50000) log = log.slice(-50000);

            const title = 'CI diagnostic: desktop build failed on ${{ matrix.artifact }}';
            const body = [
              'Automated diagnostic from workflow run ' + context.runId + '.',
              '',
              'Commit: ' + context.sha,
              '',
              '~~~text',
              log,
              '~~~'
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-diagnostic']
              });
            }

      - name: Close stale desktop diagnostic
        if: steps.desktop_build.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'CI diagnostic: desktop build failed on ${{ matrix.artifact }}';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                state: 'closed'
              });
            }

      - name: Fail job after diagnostic
        if: steps.desktop_build.outcome == 'failure'
        run: node -e "process.exit(1)"

      - name: Windows clean install and first-launch smoke
        if: steps.desktop_build.outcome == 'success' && matrix.artifact == 'windows'
        shell: pwsh
        env:
          FREEAI_EXPECT_SIGNED: ${{ steps.windows_signing.outputs.enabled }}
        run: ./scripts/windows7-installer-smoke.ps1

      - name: macOS packaged distribution and dictation smoke
        if: steps.desktop_build.outcome == 'success' && matrix.artifact == 'macos'
        shell: bash
        env:
          FREEAI_EXPECT_MAC_SIGNED: ${{ steps.macos_distribution.outputs.signed }}
          FREEAI_EXPECT_MAC_NOTARIZED: ${{ steps.macos_distribution.outputs.notarized }}
        run: |
          set -euo pipefail
          dmg="$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet || true
            rmdir "$mount_dir" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -mountpoint "$mount_dir" -nobrowse -readonly -quiet
          app_bundle="$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_bundle"

          whisper="$app_bundle/Contents/Resources/whisper/whisper-cli"
          test -x "$whisper"
          "$whisper" --version | grep -E 'whisper\.cpp version: 1\.9\.4'
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app_bundle/Contents/Info.plist" | grep -F 'Free AI uses the microphone'

          if [[ "${FREEAI_EXPECT_MAC_SIGNED:-false}" == true ]]; then
            codesign --verify --deep --strict --verbose=2 "$app_bundle"
            codesign --display --verbose=4 "$app_bundle" 2>&1 | grep -F 'Authority=Developer ID Application'
            entitlements_file="$(mktemp)"
            codesign --display --entitlements :- "$app_bundle" > "$entitlements_file" 2>/dev/null
            grep -F '<key>com.apple.security.cs.allow-jit</key>' "$entitlements_file"
            grep -F '<key>com.apple.security.device.audio-input</key>' "$entitlements_file"
          else
            if codesign --verify --deep --strict "$app_bundle" >/dev/null 2>&1; then
              echo 'Expected an unsigned development build, but codesign verification unexpectedly succeeded.' >&2
              exit 1
            fi
          fi

          if [[ "${FREEAI_EXPECT_MAC_NOTARIZED:-false}" == true ]]; then
            xcrun stapler validate "$app_bundle"
            spctl --assess --type execute --verbose=4 "$app_bundle"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.desktop_build.outcome == 'success'
        with:
          name: free-ai-${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  windows_visual:
    name: Windows visual regression
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Install pinned Playwright test driver
        run: npm install --no-save --no-package-lock @playwright/test@1.63.0

      - name: Build deterministic visual-test renderer
        run: npm run build:web
        env:
          VITE_VISUAL_TEST: '1'

      - name: Run Windows visual regression
        shell: pwsh
        run: npx playwright test --config=playwright.windows.config.mjs

      - name: Upload Windows visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-windows-visual
          path: |
            tests/visual/baselines/*.png
            artifacts/windows-visual/**
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        run: npm run validate

      - name: Build web app
        run: npm run build:web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Google OAuth deep link
        run: npm run android:configure-deeplink

      - name: Apply Free AI Android branding
        run: npm run android:configure-branding

      - name: Verify generated Android native branding
        run: node scripts/check-android6-generated-branding.mjs

      - name: Configure stable Android OAuth signing
        run: npm run android:configure-signing

      - name: Configure native Google login MainActivity
        run: npm run android:configure-social-login

      - name: Verify Android signing fingerprint
        run: chmod +x android/gradlew && cd android && ./gradlew signingReport && cd .. && cat android-oauth-info.txt

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Validate Android release-signing pipeline
        if: github.event_name != 'workflow_dispatch' || (inputs.validate_release != true && inputs.publish_release != true)
        shell: bash
        run: |
          set -euo pipefail

          test_keystore="$RUNNER_TEMP/free-ai-release-ci.jks"
          store_password="FreeAiCiRelease123!"
          key_alias="free-ai-ci-release"
          keytool -genkeypair \
            -keystore "$test_keystore" \
            -storepass "$store_password" \
            -keypass "$store_password" \
            -alias "$key_alias" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=Free AI CI, OU=QA, O=Free AI, L=CI, ST=CI, C=US" \
            -noprompt >/dev/null 2>&1

          expected_sha1="$(keytool -list -v -keystore "$test_keystore" -storepass "$store_password" -alias "$key_alias" | awk -F': ' '/SHA1:/{print $2; exit}')"
          keystore_base64="$(base64 -w 0 "$test_keystore")"

          original_gradle="$RUNNER_TEMP/free-ai-release-ci-build.gradle"
          cp android/app/build.gradle "$original_gradle"
          cleanup() {
            cp "$original_gradle" android/app/build.gradle || true
            rm -f android/app/free-ai-release.keystore "$test_keystore"
          }
          trap cleanup EXIT

          ANDROID_RELEASE_KEYSTORE_BASE64="$keystore_base64" \
          ANDROID_RELEASE_STORE_PASSWORD="$store_password" \
          ANDROID_RELEASE_KEY_ALIAS="$key_alias" \
          ANDROID_RELEASE_KEY_PASSWORD="$store_password" \
          ANDROID_RELEASE_EXPECTED_SHA1="$expected_sha1" \
            npm run android:configure-release-signing

          cd android
          ANDROID_RELEASE_STORE_PASSWORD="$store_password" \
          ANDROID_RELEASE_KEY_ALIAS="$key_alias" \
          ANDROID_RELEASE_KEY_PASSWORD="$store_password" \
            ./gradlew assembleRelease
          cd ..

          test -f android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Load Android production signing
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.validate_release == true || inputs.publish_release == true))
        shell: bash
        env:
          SECRET_ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          SECRET_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          SECRET_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          SECRET_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          SECRET_ANDROID_RELEASE_EXPECTED_SHA1: ${{ secrets.ANDROID_RELEASE_EXPECTED_SHA1 }}
        run: |
          set -euo pipefail

          configured=0
          for name in \
            SECRET_ANDROID_RELEASE_KEYSTORE_BASE64 \
            SECRET_ANDROID_RELEASE_STORE_PASSWORD \
            SECRET_ANDROID_RELEASE_KEY_ALIAS \
            SECRET_ANDROID_RELEASE_KEY_PASSWORD \
            SECRET_ANDROID_RELEASE_EXPECTED_SHA1
          do
            [[ -n "${!name:-}" ]] && configured=$((configured+1))
          done

          if [[ "$configured" -eq 5 ]]; then
            echo "::notice::Using Android production signing from GitHub Actions secrets."
            node - "$GITHUB_ENV" <<'NODE'
          const fs=require('node:fs');
          const out=process.argv[2];
          const map={
            ANDROID_RELEASE_KEYSTORE_BASE64:process.env.SECRET_ANDROID_RELEASE_KEYSTORE_BASE64,
            ANDROID_RELEASE_STORE_PASSWORD:process.env.SECRET_ANDROID_RELEASE_STORE_PASSWORD,
            ANDROID_RELEASE_KEY_ALIAS:process.env.SECRET_ANDROID_RELEASE_KEY_ALIAS,
            ANDROID_RELEASE_KEY_PASSWORD:process.env.SECRET_ANDROID_RELEASE_KEY_PASSWORD,
            ANDROID_RELEASE_EXPECTED_SHA1:process.env.SECRET_ANDROID_RELEASE_EXPECTED_SHA1,
          };
          for(const [name,value] of Object.entries(map)){
            if(!value)throw new Error('Missing Android release signing value: '+name);
            console.log('::add-mask::'+value);
            fs.appendFileSync(out,name+'='+value+'\n');
          }
          NODE
          else
            if [[ "$configured" -ne 0 ]]; then
              echo "::warning::Android GitHub signing secrets are only partially configured; using the complete Supabase Vault bundle instead."
            else
              echo "::notice::Android GitHub signing secrets are not configured; loading the production bundle from Supabase Vault through GitHub OIDC."
            fi

            oidc_response="$RUNNER_TEMP/free-ai-release-signing-oidc.json"
            oidc_token_file="$RUNNER_TEMP/free-ai-release-signing-oidc-token"
            bundle_response="$RUNNER_TEMP/free-ai-release-signing-bundle.json"

            curl --silent --show-error --fail \
              --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=free-ai-release-signing" \
              --output "$oidc_response"

            node - "$oidc_response" "$oidc_token_file" <<'NODE'
          const fs=require('node:fs');
          const [responsePath,tokenPath]=process.argv.slice(2);
          const response=JSON.parse(fs.readFileSync(responsePath,'utf8'));
          if(typeof response.value!=='string'||!response.value)throw new Error('GitHub OIDC token response is missing value');
          fs.writeFileSync(tokenPath,response.value,{mode:0o600});
          NODE

            http_code="$(curl --silent --show-error \
              --output "$bundle_response" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $(cat "$oidc_token_file")" \
              "https://xquntkgjlmrxkwkrwsjl.supabase.co/functions/v1/free-ai-release-signing-bundle")"

            rm -f "$oidc_response" "$oidc_token_file"

            if [[ "$http_code" != "200" ]]; then
              echo "::error::Supabase release-signing broker returned HTTP $http_code."
              exit 1
            fi

            node - "$bundle_response" "$GITHUB_ENV" <<'NODE'
          const fs=require('node:fs');
          const [responsePath,out]=process.argv.slice(2);
          const response=JSON.parse(fs.readFileSync(responsePath,'utf8'));
          if(response.ok!==true||!response.android)throw new Error('Supabase release-signing broker returned an invalid bundle');
          const map={
            ANDROID_RELEASE_KEYSTORE_BASE64:response.android.keystore_base64,
            ANDROID_RELEASE_STORE_PASSWORD:response.android.store_password,
            ANDROID_RELEASE_KEY_ALIAS:response.android.key_alias,
            ANDROID_RELEASE_KEY_PASSWORD:response.android.key_password,
            ANDROID_RELEASE_EXPECTED_SHA1:response.android.expected_sha1,
          };
          for(const [name,value] of Object.entries(map)){
            if(typeof value!=='string'||!value)throw new Error('Incomplete Android release signing bundle: '+name);
            console.log('::add-mask::'+value);
            fs.appendFileSync(out,name+'='+value+'\n');
          }
          NODE
            rm -f "$bundle_response"
          fi

      - name: Build signed Android release APK
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.validate_release == true || inputs.publish_release == true))
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail

          original_gradle="$RUNNER_TEMP/free-ai-app-build.gradle"
          cp android/app/build.gradle "$original_gradle"
          cleanup() {
            cp "$original_gradle" android/app/build.gradle || true
            rm -f android/app/free-ai-release.keystore
          }
          trap cleanup EXIT

          npm run build:web
          npx cap copy android
          npm run android:configure-release-signing

          KEYSTORE_SHA1="$(keytool -list -v \
            -keystore android/app/free-ai-release.keystore \
            -storepass "$ANDROID_RELEASE_STORE_PASSWORD" \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" | awk -F': ' '/SHA1:/{print $2; exit}')"
          KEYSTORE_SHA1="$(printf '%s' "$KEYSTORE_SHA1" | tr -cd '0-9A-Fa-f' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA1="$(printf '%s' "$ANDROID_RELEASE_EXPECTED_SHA1" | tr -cd '0-9A-Fa-f' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$KEYSTORE_SHA1" || "$KEYSTORE_SHA1" != "$EXPECTED_SHA1" ]]; then
            echo "Android release keystore certificate does not match the trusted expected SHA-1 metadata." >&2
            exit 1
          fi

          cd android
          ./gradlew assembleRelease
          cd ..

          VERSION="$(node -p "require('./package.json').version")"
          VERSION_CODE="$(node - <<'NODE'
          const [major,minor,patch]=require('./package.json').version.split('.').map(Number);
          process.stdout.write(String(major*1000000+minor*1000+patch));
          NODE
          )"
          SOURCE_APK="android/app/build/outputs/apk/release/app-release.apk"
          OUTPUT_DIR="release-android"
          OUTPUT_APK="$OUTPUT_DIR/Free-AI-Android-$VERSION.apk"
          test -f "$SOURCE_APK"
          mkdir -p "$OUTPUT_DIR"
          cp "$SOURCE_APK" "$OUTPUT_APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt -print | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT_APK"
          ACTUAL_SHA1="$("$APKSIGNER" verify --print-certs "$OUTPUT_APK" | awk -F': ' '/certificate SHA-1 digest/{print $2; exit}')"
          ACTUAL_SHA1="$(printf '%s' "$ACTUAL_SHA1" | tr -cd '0-9A-Fa-f' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$ACTUAL_SHA1" || "$ACTUAL_SHA1" != "$KEYSTORE_SHA1" ]]; then
            echo "Android release APK certificate does not match the loaded production keystore." >&2
            exit 1
          fi

          BADGING="$("$AAPT" dump badging "$OUTPUT_APK" | head -n1)"
          grep -F "name='com.freeai.mobile'" <<<"$BADGING"
          grep -F "versionName='$VERSION'" <<<"$BADGING"
          grep -F "versionCode='$VERSION_CODE'" <<<"$BADGING"

      - name: Build runtime QA APKs
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/free-ai-app-debug.apk"

          VITE_ANDROID_AUTH_QA=1 npm run build:web
          npx cap copy android
          npm run android:configure-runtime-qa
          cd android
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/free-ai-auth-runtime-qa.apk

          VITE_VISUAL_TEST=1 npm run build:web
          npx cap copy android
          npm run android:configure-runtime-qa
          cd android
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/free-ai-runtime-qa.apk
          cp "$RUNNER_TEMP/free-ai-app-debug.apk" android/app/build/outputs/apk/debug/app-debug.apk
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: free-ai-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-oauth-info.txt
          if-no-files-found: error

      - name: Upload signed Android release APK
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.validate_release == true || inputs.publish_release == true))
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-android-release
          path: release-android/Free-AI-Android-*.apk
          if-no-files-found: error

      - name: Upload Android runtime QA APK
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-android-runtime-qa
          path: android/app/build/outputs/apk/debug/free-ai-runtime-qa.apk
          if-no-files-found: error

      - name: Upload Android auth runtime QA APK
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-android-auth-runtime-qa
          path: android/app/build/outputs/apk/debug/free-ai-auth-runtime-qa.apk
          if-no-files-found: error

  android_runtime:
    name: Android runtime (${{ matrix.form_factor }})
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - form_factor: phone
            profile: pixel_5
          - form_factor: large-phone
            profile: pixel_7_pro
          - form_factor: tablet
            profile: pixel_tablet

    steps:
      - uses: actions/checkout@v4

      - name: Download Android runtime QA build
        uses: actions/download-artifact@v4
        with:
          name: free-ai-android-runtime-qa
          path: runtime-artifacts

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android 16 runtime QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          cores: 2
          ram-size: 3072M
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/android-runtime-qa.sh ${{ matrix.form_factor }}

      - name: Upload Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-android-runtime-${{ matrix.form_factor }}
          path: artifacts/android-runtime/${{ matrix.form_factor }}
          if-no-files-found: warn

  android_auth_runtime:
    name: Android auth runtime (email/session)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.validate_release == true || inputs.publish_release == true)))
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - id: auth_config
        name: Inspect public Supabase auth configuration
        shell: bash
        run: |
          public_config_file="$RUNNER_TEMP/free-ai-public-auth-config"
          node - "$public_config_file" <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('src/main.jsx', 'utf8');
          const url = source.match(/const supabaseUrl=import\.meta\.env\.VITE_SUPABASE_URL\|\|'([^']+)'/)?.[1] || '';
          const key = source.match(/const supabaseKey=import\.meta\.env\.VITE_SUPABASE_ANON_KEY\|\|'([^']+)'/)?.[1] || '';
          if (!url || !key || !key.startsWith('sb_publishable_')) {
            console.error('Unable to resolve the app public Supabase fallback configuration.');
            process.exit(1);
          }
          fs.writeFileSync(process.argv[2], JSON.stringify({ url, key }));
          NODE

          SUPABASE_URL_FOR_QA="$VITE_SUPABASE_URL"
          SUPABASE_KEY_FOR_QA="$VITE_SUPABASE_ANON_KEY"
          if [[ -z "$SUPABASE_URL_FOR_QA" || -z "$SUPABASE_KEY_FOR_QA" ]]; then
            SUPABASE_URL_FOR_QA="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).url" "$public_config_file")"
            SUPABASE_KEY_FOR_QA="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).key" "$public_config_file")"
            echo "::notice::Android auth QA is using the same public Supabase fallback configuration bundled by the app."
          fi

          settings_file="$RUNNER_TEMP/free-ai-auth-settings.json"
          http_code="$(curl --silent --show-error --output "$settings_file" --write-out '%{http_code}' \
            --header "apikey: $SUPABASE_KEY_FOR_QA" \
            "$SUPABASE_URL_FOR_QA/auth/v1/settings")"

          if [[ "$http_code" != "200" ]]; then
            echo "::error::Supabase /auth/v1/settings returned HTTP $http_code."
            exit 1
          fi

          node - "$settings_file" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const [settingsPath, outputPath] = process.argv.slice(2);
          const settings = JSON.parse(fs.readFileSync(settingsPath, 'utf8'));
          const disableSignup = settings.disable_signup === true;
          const autoConfirm = settings.mailer_autoconfirm === true || settings.autoconfirm === true;
          const googleEnabled = settings.external?.google === true;
          fs.appendFileSync(outputPath,
            `disable_signup=${disableSignup}\nmailer_autoconfirm=${autoConfirm}\ngoogle_enabled=${googleEnabled}\n`);
          console.log(`Supabase Auth: signup=${disableSignup ? 'disabled' : 'enabled'}, email_autoconfirm=${autoConfirm ? 'enabled' : 'disabled'}, google=${googleEnabled ? 'enabled' : 'disabled'}`);
          NODE

      - id: github_oidc
        name: Verify GitHub OIDC trust with Supabase
        shell: bash
        run: |
          oidc_response="$RUNNER_TEMP/free-ai-github-oidc.json"
          oidc_token_file="$RUNNER_TEMP/free-ai-github-oidc-token"
          broker_response="$RUNNER_TEMP/free-ai-oidc-broker-response.json"

          curl --silent --show-error --fail \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=free-ai-android-auth-qa" \
            --output "$oidc_response"

          node - "$oidc_response" "$oidc_token_file" <<'NODE'
          const fs = require('node:fs');
          const [responsePath, tokenPath] = process.argv.slice(2);
          const response = JSON.parse(fs.readFileSync(responsePath, 'utf8'));
          if (!response.value || typeof response.value !== 'string') {
            console.error('GitHub OIDC token response did not contain a token.');
            process.exit(1);
          }
          fs.writeFileSync(tokenPath, response.value, { mode: 0o600 });
          NODE

          http_code="$(curl --silent --show-error \
            --output "$broker_response" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $(cat "$oidc_token_file")" \
            "https://xquntkgjlmrxkwkrwsjl.supabase.co/functions/v1/free-ai-ci-oidc-check")"

          rm -f "$oidc_response" "$oidc_token_file"

          if [[ "$http_code" != "200" ]]; then
            echo "::error::Supabase GitHub OIDC verifier returned HTTP $http_code."
            cat "$broker_response"
            exit 1
          fi

          node - "$broker_response" <<'NODE'
          const fs = require('node:fs');
          const response = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (response.ok !== true) {
            console.error('Supabase GitHub OIDC verifier rejected the workflow identity.');
            process.exit(1);
          }
          console.log('GitHub OIDC trust verified by Supabase Edge Function.');
          NODE

      - id: provision_qa_account
        name: Provision ephemeral Android auth QA account
        shell: bash
        run: |
          qa_password="Qa1!$(openssl rand -hex 32)"
          echo "::add-mask::$qa_password"

          oidc_response="$RUNNER_TEMP/free-ai-provision-oidc.json"
          oidc_token_file="$RUNNER_TEMP/free-ai-provision-oidc-token"
          provision_body="$RUNNER_TEMP/free-ai-provision-body.json"
          provision_response="$RUNNER_TEMP/free-ai-provision-response.json"

          curl --silent --show-error --fail \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=free-ai-android-auth-qa" \
            --output "$oidc_response"

          node - "$oidc_response" "$oidc_token_file" <<'NODE'
          const fs = require('node:fs');
          const [responsePath, tokenPath] = process.argv.slice(2);
          const response = JSON.parse(fs.readFileSync(responsePath, 'utf8'));
          if (!response.value || typeof response.value !== 'string') {
            console.error('GitHub OIDC token response did not contain a token.');
            process.exit(1);
          }
          fs.writeFileSync(tokenPath, response.value, { mode: 0o600 });
          NODE

          printf '%s' "$qa_password" > "$RUNNER_TEMP/free-ai-qa-password"
          node - "$RUNNER_TEMP/free-ai-qa-password" "$provision_body" <<'NODE'
          const fs = require('node:fs');
          const [passwordPath, bodyPath] = process.argv.slice(2);
          const password = fs.readFileSync(passwordPath, 'utf8');
          fs.writeFileSync(bodyPath, JSON.stringify({ password }), { mode: 0o600 });
          NODE

          http_code="$(curl --silent --show-error \
            --output "$provision_response" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $(cat "$oidc_token_file")" \
            --header "Content-Type: application/json" \
            --data-binary "@$provision_body" \
            "https://xquntkgjlmrxkwkrwsjl.supabase.co/functions/v1/free-ai-ci-auth-provision")"

          rm -f "$oidc_response" "$oidc_token_file" "$provision_body" "$RUNNER_TEMP/free-ai-qa-password"

          if [[ "$http_code" != "200" ]]; then
            echo "::error::Supabase QA account provisioner returned HTTP $http_code."
            cat "$provision_response"
            exit 1
          fi

          qa_email="$(node - "$provision_response" <<'NODE'
          const fs = require('node:fs');
          const response = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (response.ok !== true || typeof response.email !== 'string' || !response.email) {
            console.error('Supabase QA account provisioner did not return a valid account.');
            process.exit(1);
          }
          process.stdout.write(response.email);
          NODE
          )"

          echo "::add-mask::$qa_email"
          {
            echo "ANDROID_AUTH_TEST_EMAIL=$qa_email"
            echo "ANDROID_AUTH_TEST_PASSWORD=$qa_password"
          } >> "$GITHUB_ENV"

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Ephemeral Android auth QA account provisioned for this workflow run."

      - name: Download Android auth runtime QA build
        if: steps.provision_qa_account.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: free-ai-android-auth-runtime-qa
          path: runtime-artifacts

      - name: Enable KVM
        if: steps.provision_qa_account.outputs.configured == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android 16 email/session auth QA
        if: steps.provision_qa_account.outputs.configured == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          ram-size: 3072M
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/android-auth-runtime-qa.sh

      - name: Upload Android auth runtime evidence
        if: always() && steps.provision_qa_account.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-android-auth-runtime-email-session
          path: artifacts/android-auth-runtime
          if-no-files-found: warn


  android_google_runtime:
    name: Android Google Credential Manager runtime
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Download Android auth runtime QA build
        uses: actions/download-artifact@v4
        with:
          name: free-ai-android-auth-runtime-qa
