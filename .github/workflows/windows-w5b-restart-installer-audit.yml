name: Windows W5B Restart Installer Audit

on:
  push:
    branches: [windows/w5-native-qa]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows_w5b:
    name: Windows W5B Restart and Installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Install pinned Playwright Electron driver
        run: npm install --no-save --no-package-lock @playwright/test@1.63.0
      - name: Build auth-independent renderer for restart QA
        run: npm run build:web
        env:
          VITE_VISUAL_TEST: '1'
      - name: Run process restart persistence audit
        continue-on-error: true
        run: npx playwright test tests/audit/windows-w5b-restart.spec.mjs --workers=1 --reporter=list
      - name: Gate restart persistence
        shell: pwsh
        run: |
          $file = 'artifacts/windows-w5b/results.json'
          if (-not (Test-Path $file)) { throw 'Windows W5B restart result file was not produced.' }
          $rows = Get-Content $file -Raw | ConvertFrom-Json
          $failed = @($rows | Where-Object { $_.status -eq 'FAIL' })
          if ($failed.Count -gt 0) {
            $failed | ConvertTo-Json -Depth 6 | Write-Host
            throw "Windows W5B restart audit found $($failed.Count) real failure(s)."
          }
      - name: Build Windows NSIS package
        run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Run clean-install, first-launch, restart, uninstall smoke
        shell: pwsh
        env:
          FREEAI_EXPECT_SIGNED: 'false'
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/windows-w5b | Out-Null
          & ./scripts/windows7-installer-smoke.ps1 *>&1 | Tee-Object -FilePath artifacts/windows-w5b/installer-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows W5B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-windows-w5b-audit
          path: |
            artifacts/windows-w5b/**
            release/Free-AI-Windows-*.exe
          if-no-files-found: error
