name: Windows Composer Layout Implementation

on:
  push:
    branches: [windows/post-w7-composer-browser-layout]
    paths: [.github/workflows/windows-composer-layout-implementation.yml]

permissions:
  contents: read

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.patch.outputs.commit }}
    steps:
      - name: Apply exact audited CSS patch and remove one-shot workflow
        id: patch
        uses: actions/github-script@v7
        with:
          script: |
            const repo=context.repo;
            const branch='windows/post-w7-composer-browser-layout';
            if(context.ref!=='refs/heads/'+branch)throw new Error('Unexpected branch');
            const {data:main}=await github.rest.git.getRef({...repo,ref:'heads/main'});
            if(main.object.sha!=='3f3c1e2b63ce15d00c34aac4ad5040d1f4b95b60')throw new Error('main moved; audit again');
            const {data:head}=await github.rest.git.getRef({...repo,ref:'heads/'+branch});
            if(head.object.sha!==context.sha)throw new Error('Branch moved; refuse stale update');
            const {data:file}=await github.rest.repos.getContent({...repo,path:'src/styles.css',ref:context.sha});
            if(file.type!=='file'||file.sha!=='72e349def97048af5e73f903936f9226c0f715c3')throw new Error('Unexpected CSS source blob');
            const source=Buffer.from(file.content,'base64').toString('utf8');
            const patch=`
            /* Windows split panes: size against the chat column, never the viewport.
               Keep the no-panel shell baseline and native-mobile layouts unchanged. */
            @media (min-width:761px){
              .windowsDesktopRoot .desktopShell.hasSidePanel .emptyChat,
              .windowsDesktopRoot .desktopShell.hasSidePanel .conversationComposer{
                min-width:0;
              }
              .windowsDesktopRoot .desktopShell.hasSidePanel .gptComposer{
                width:100%;
                min-width:0;
                max-width:768px;
              }
              .windowsDesktopRoot .desktopShell.hasSidePanel .gptComposer.workComposer{
                max-width:820px;
              }
              .windowsDesktopRoot .desktopShell.hasSidePanel .composerBottom{
                position:relative;
                flex-wrap:wrap;
                row-gap:6px;
              }
              .windowsDesktopRoot .desktopShell.hasSidePanel .composerLeft,
              .windowsDesktopRoot .desktopShell.hasSidePanel .composerRight{
                max-width:100%;
                flex-wrap:wrap;
              }
              .windowsDesktopRoot .desktopShell.hasSidePanel .composerRight{
                margin-left:auto;
                justify-content:flex-end;
              }
              .windowsDesktopRoot .desktopShell.hasSidePanel .composerBottom .menuAnchor{
                position:static;
                min-width:0;
                max-width:100%;
              }
              .windowsDesktopRoot .desktopShell.hasSidePanel .modelButton,
              .windowsDesktopRoot .desktopShell.hasSidePanel .teamButton{
                max-width:100%;
              }
              /* Menus use the full controls row as their containing block, not
                 a small model/Add button that may be next to either pane edge. */
              .windowsDesktopRoot .desktopShell.hasSidePanel .composerBottom .floatingMenu{
                max-width:100%;
                max-height:min(440px,45vh);
                bottom:calc(100% + 8px);
              }
              .windowsDesktopRoot .desktopShell.hasSidePanel .composerBottom .plusPicker,
              .windowsDesktopRoot .desktopShell.hasSidePanel .composerBottom .permissionPicker{
                left:0;
                right:auto;
              }
              .windowsDesktopRoot .desktopShell.hasSidePanel .composerBottom .modelPicker,
              .windowsDesktopRoot .desktopShell.hasSidePanel .composerBottom .teamPicker,
              .windowsDesktopRoot .desktopShell.hasSidePanel .composerBottom .effortPicker{
                left:auto;
                right:0;
              }
              .windowsDesktopRoot .desktopShell.hasSidePanel .workActions{
                flex-wrap:wrap;
              }
              .windowsDesktopRoot .desktopShell.hasSidePanel .workActions button{
                max-width:100%;
                overflow-wrap:anywhere;
              }
            }
            `;
            const {data:parent}=await github.rest.git.getCommit({...repo,commit_sha:context.sha});
            const {data:tree}=await github.rest.git.createTree({...repo,base_tree:parent.tree.sha,tree:[
              {path:'src/styles.css',mode:'100644',type:'blob',content:source.trimEnd()+'\n'+patch},
              {path:'.github/workflows/windows-composer-layout-implementation.yml',mode:'100644',type:'blob',sha:null}
            ]});
            const {data:commit}=await github.rest.git.createCommit({...repo,message:'Windows: contain Composer controls and menus within the Browser split pane',tree:tree.sha,parents:[context.sha]});
            await github.rest.git.updateRef({...repo,ref:'heads/'+branch,sha:commit.sha,force:false});
            core.setOutput('commit',commit.sha);
            console.log('Implementation commit: '+commit.sha);

  focused_smoke:
    name: Focused Windows Composer implementation smoke
    needs: implement
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.implement.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock @playwright/test@1.63.0
      - name: Syntax and source guards
        run: |
          node --check tests/visual/windows-browser-composer.spec.mjs
          node --check playwright.windows.config.mjs
          npm run validate
      - name: Build auth-independent renderer
        run: npm run build:web
        env:
          VITE_VISUAL_TEST: '1'
      - name: Focused implementation smoke only
        run: npx playwright test --config=playwright.windows.config.mjs windows-browser-composer.spec.mjs --workers=1
      - name: Upload focused implementation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-composer-layout-implementation
          path: artifacts/windows-visual/**
          if-no-files-found: warn
