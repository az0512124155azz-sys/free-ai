name: Windows Search Cleanup Implementation

on:
  push:
    branches: [windows/post-w7-search-chats]
    paths: [.github/workflows/windows-search-cleanup-implementation.yml]

permissions:
  contents: read

jobs:
  implement:
    if: github.ref == 'refs/heads/windows/post-w7-search-chats'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.fix.outputs.commit }}
    steps:
      - name: Apply audited Windows Search Chats source change
        id: fix
        uses: actions/github-script@v7
        with:
          script: |
            const repo=context.repo;
            const branch='windows/post-w7-search-chats';
            const expectedBase='307754cfa67ae8caae3f27454393eacff2272bdb';
            const {data:base}=await github.rest.git.getRef({...repo,ref:'heads/main'});
            if(base.object.sha!==expectedBase)throw new Error('main moved; re-audit required');
            const {data:head}=await github.rest.git.getRef({...repo,ref:'heads/'+branch});
            if(head.object.sha!==context.sha)throw new Error('Branch moved; refusing stale update');
            const {data:file}=await github.rest.repos.getContent({...repo,path:'src/main.jsx',ref:context.sha});
            if(file.type!=='file'||file.sha!=='3cb5c51819a2a41eaa6f52888ac5343a13cf1e49')throw new Error('Unexpected source blob');
            const source=Buffer.from(file.content,'base64').toString('utf8');
            const before=`<button title="Search chats" aria-label="Search chats" onClick={()=>setSidebarSearchOpen(v=>!v)}><Search size={16}/></button>`;
            const after=`<button title="Search chats" aria-label="Search chats" aria-expanded={sidebarSearchOpen} onClick={()=>{if(isWindowsDesktop)setSidebarSearch('');setSidebarSearchOpen(v=>!v)}}><Search size={16}/></button>`;
            if(source.split(before).length!==2)throw new Error('Expected exactly one Search toggle');
            const {data:updated}=await github.rest.repos.createOrUpdateFileContents({
              ...repo,path:'src/main.jsx',branch,sha:file.sha,
              message:'Windows: clear sidebar search when toggling Search Chats',
              content:Buffer.from(source.replace(before,after),'utf8').toString('base64')
            });
            core.setOutput('commit',updated.commit.sha);
            console.log('Implementation commit: '+updated.commit.sha);

  regression:
    name: Focused Windows Search Chats Regression
    needs: implement
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.implement.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Install pinned Playwright Electron driver
        run: npm install --no-save --no-package-lock @playwright/test@1.63.0
      - name: Validate app
        run: npm run validate
      - name: Build auth-independent Windows renderer
        run: npm run build:web
        env:
          VITE_VISUAL_TEST: '1'
      - name: Run focused Windows Electron regression
        run: npx playwright test --config=playwright.windows.config.mjs tests/visual/windows-sidebar-search.spec.mjs --workers=1
      - name: Upload Search Chats screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-search-cleanup-implementation
          path: artifacts/windows-visual/**
          if-no-files-found: warn
