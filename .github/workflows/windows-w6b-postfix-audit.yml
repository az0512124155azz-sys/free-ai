name: Windows W6B Postfix Audit

on:
  push:
    branches: [audit/windows-w6b-postfix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows_w6b:
    name: Windows W6B Postfix Agent Chats
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Install pinned Playwright Electron driver
        run: npm install --no-save --no-package-lock @playwright/test@1.63.0
      - name: Build auth-independent Windows renderer
        run: npm run build:web
        env:
          VITE_VISUAL_TEST: '1'
      - name: Run Windows W6B audit
        continue-on-error: true
        run: npx playwright test tests/audit/windows-w6b-projects.spec.mjs --workers=1 --reporter=list
      - name: Upload Windows W6B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-windows-w6b-postfix-audit
          path: artifacts/windows-w6b/**
          if-no-files-found: error
      - name: Fail on real W6B failures
        if: always()
        shell: pwsh
        run: |
          $file='artifacts/windows-w6b/results.json'
          if (-not (Test-Path $file)) { throw 'Windows W6B results were not produced.' }
          $rows=Get-Content $file -Raw | ConvertFrom-Json
          $failed=@($rows | Where-Object { $_.status -eq 'FAIL' })
          if ($failed.Count -gt 0) {
            $failed | ConvertTo-Json -Depth 6 | Write-Host
            throw "Windows W6B found $($failed.Count) failure(s)."
          }
          Write-Host 'Windows W6B passed.'
