name: Windows W7A Security Runtime Audit

on:
  push:
    branches: [audit/windows-w7a-security-runtime]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows_w7a:
    name: Windows W7A Security and Recovery
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Install pinned Playwright Electron driver
        run: npm install --no-save --no-package-lock @playwright/test@1.63.0
      - name: Validate complete app and Windows 7 guards
        run: npm run validate
      - name: Build auth-independent Windows renderer
        run: npm run build:web
        env:
          VITE_VISUAL_TEST: '1'
      - name: Run Windows W7A runtime audit
        continue-on-error: true
        run: npx playwright test tests/audit/windows-w7a-security.spec.mjs --workers=1 --reporter=list
      - name: Upload Windows W7A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-windows-w7a-audit
          path: artifacts/windows-w7a/**
          if-no-files-found: error
      - name: Fail on real W7A failures
        if: always()
        shell: pwsh
        run: |
          $file='artifacts/windows-w7a/results.json'
          if (-not (Test-Path $file)) { throw 'Windows W7A results were not produced.' }
          $rows=Get-Content $file -Raw | ConvertFrom-Json
          $failed=@($rows | Where-Object { $_.status -eq 'FAIL' })
          if ($failed.Count -gt 0) {
            $failed | ConvertTo-Json -Depth 6 | Write-Host
            throw "Windows W7A found $($failed.Count) failure(s)."
          }
          Write-Host 'Windows W7A passed.'
