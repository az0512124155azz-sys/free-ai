name: Windows Known Fixes Audit

on:
  push:
    branches: [windows/fix-known-w2-w3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows_known_fixes:
    name: Windows W2 W3 Regression Fixes
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Install pinned Playwright Electron driver
        run: npm install --no-save --no-package-lock @playwright/test@1.63.0
      - name: Validate app
        run: npm run validate
      - name: Build auth-independent Windows renderer
        run: npm run build:web
        env:
          VITE_VISUAL_TEST: '1'
      - name: Run known-fixes Windows audit
        continue-on-error: true
        run: npx playwright test tests/audit/windows-known-fixes.spec.mjs --workers=1 --reporter=list
      - name: Upload known-fixes evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-windows-known-fixes
          path: artifacts/windows-known-fixes/**
          if-no-files-found: error
      - name: Fail on real regression failures
        if: always()
        shell: pwsh
        run: |
          $file='artifacts/windows-known-fixes/results.json'
          if (-not (Test-Path $file)) { throw 'Windows known-fixes results were not produced.' }
          $rows=Get-Content $file -Raw | ConvertFrom-Json
          $failed=@($rows | Where-Object { $_.status -eq 'FAIL' })
          if ($failed.Count -gt 0) {
            $failed | ConvertTo-Json -Depth 6 | Write-Host
            throw "Windows known-fixes audit found $($failed.Count) failure(s)."
          }
          Write-Host 'Windows known-fixes audit passed.'
